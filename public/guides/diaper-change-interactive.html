<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<meta name="theme-color" content="#2E6B62">
<title>Hub2Care · מדריך החלפת חיתול</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Malayalam:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f1e6;
  --paper:#fffaf2;
  --ink:#26221d;
  --ink2:#5b5247;
  --muted:#8a7f73;
  --line:rgba(60,45,30,.12);
  --line-2:rgba(60,45,30,.07);

  --teal-50:#eaf5f2;
  --teal-100:#d3eae4;
  --teal-300:#7eb5ab;
  --teal-500:#3E8279;
  --teal-700:#2E6B62;
  --teal-900:#1f4a44;

  --amber-50:#fcf3e0;
  --amber-100:#f7e3b8;
  --amber-300:#e2b35a;
  --amber-700:#9a6d18;

  --rose-50:#fbeeec;
  --rose-100:#f6d7d2;
  --rose-300:#dd8b80;
  --rose-700:#9b3a2c;

  --indigo-50:#ecedf6;
  --indigo-100:#d6d8ec;
  --indigo-300:#7b80b8;
  --indigo-700:#363c83;

  --shadow:0 4px 16px rgba(40,30,20,.06), 0 1px 4px rgba(40,30,20,.04);
  --shadow-lg:0 12px 40px rgba(40,30,20,.10), 0 2px 8px rgba(40,30,20,.06);
  --radius:14px;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Heebo','Noto Sans','Noto Sans Malayalam',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);
  color:var(--ink);
  line-height:1.65;
  font-size:16px;
  -webkit-font-smoothing:antialiased;
}
body[dir=ltr]{font-family:'Noto Sans','Heebo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
body[lang=ml]{font-family:'Noto Sans Malayalam','Heebo',sans-serif}

/* ── Header ────────────────────── */
.hero{
  position:relative;
  background:
    radial-gradient(ellipse 80% 60% at 20% 0%, rgba(126,181,171,.55) 0%, transparent 60%),
    radial-gradient(ellipse 70% 50% at 80% 100%, rgba(31,74,68,.45) 0%, transparent 55%),
    linear-gradient(135deg, #3E8279 0%, #2E6B62 50%, #255850 100%);
  color:#fff;
  padding:42px 24px 56px;
  overflow:hidden;
  isolation:isolate;
}
.hero::before{
  content:"";
  position:absolute;
  inset:0;
  background-image:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='200' height='200' filter='url(%23n)' opacity='.45'/></svg>");
  opacity:.18;
  mix-blend-mode:overlay;
  pointer-events:none;
  z-index:-1;
}
.brand{
  display:flex; align-items:center; gap:10px;
  font-size:13px; font-weight:600;
  letter-spacing:.04em;
  opacity:.85;
}
.brand-dot{
  width:8px;height:8px;border-radius:50%;
  background:#f0d57a;
  box-shadow:0 0 0 3px rgba(240,213,122,.25);
}
.hero h1{
  font-size:clamp(28px, 5vw, 40px);
  font-weight:800;
  line-height:1.15;
  margin:14px 0 6px;
  letter-spacing:-.01em;
}
.hero .subtitle{
  font-size:15px;
  font-weight:400;
  opacity:.9;
  margin:0 0 18px;
  max-width:640px;
}
.tagline{
  display:inline-block;
  font-size:13px;
  font-weight:500;
  padding:6px 12px;
  border:1px solid rgba(255,255,255,.25);
  border-radius:999px;
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(6px);
}
.disclaimer{
  margin:18px 0 0;
  padding:12px 14px;
  font-size:13px;
  font-weight:400;
  line-height:1.55;
  color:rgba(255,255,255,.92);
  background:rgba(0,0,0,.18);
  border-inline-start:3px solid #f0d57a;
  border-radius:8px;
  max-width:680px;
  backdrop-filter:blur(4px);
}

/* ── Back to top ───────────────── */
.back-wrap{
  display:flex; justify-content:center;
  margin:22px 0 0;
}
.back-btn{
  display:inline-flex; align-items:center; gap:10px;
  padding:12px 22px;
  background:var(--teal-700);
  color:#fff;
  border:0;
  border-radius:999px;
  font:inherit; font-size:14.5px; font-weight:600;
  cursor:pointer;
  box-shadow:0 4px 14px rgba(46,107,98,.28), 0 1px 4px rgba(40,30,20,.08);
  transition:all .2s ease;
  letter-spacing:.005em;
}
.back-btn:hover{
  background:var(--teal-900);
  transform:translateY(-1px);
  box-shadow:0 6px 18px rgba(46,107,98,.34), 0 2px 6px rgba(40,30,20,.10);
}
.back-btn:active{transform:translateY(0)}
.back-arrow{
  display:inline-grid; place-items:center;
  width:22px; height:22px;
  border-radius:50%;
  background:rgba(255,255,255,.18);
  font-size:14px; font-weight:700;
  line-height:1;
}

/* ── Lang switcher ─────────────── */
.langbar{
  display:flex; flex-wrap:wrap; gap:6px;
  padding:14px 24px;
  background:#ffffff;
  border-bottom:1px solid var(--line);
  position:sticky; top:0; z-index:30;
  box-shadow:0 1px 0 rgba(0,0,0,.02);
}
.lang-btn{
  flex:0 0 auto;
  padding:8px 16px;
  border:1px solid var(--line);
  border-radius:999px;
  background:#fff;
  color:var(--ink2);
  font:inherit; font-size:13px; font-weight:600;
  cursor:pointer;
  transition:all .18s ease;
  font-family:inherit;
}
.lang-btn:hover{border-color:var(--teal-500); color:var(--teal-700)}
.lang-btn.active{
  background:var(--teal-700);
  border-color:var(--teal-700);
  color:#fff;
}

/* ── Container ─────────────────── */
.container{
  max-width:780px;
  margin:0 auto;
  padding:24px 18px 80px;
}
.controls{
  display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap;
  margin-bottom:14px;
}
.ctrl-btn{
  padding:6px 14px;
  background:transparent;
  border:1px solid var(--line);
  border-radius:8px;
  color:var(--ink2);
  font:inherit; font-size:12.5px; font-weight:500;
  cursor:pointer;
  transition:all .15s;
}
.ctrl-btn:hover{background:#fff; border-color:var(--teal-500); color:var(--teal-700)}

/* ── Accordion ─────────────────── */
.section{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--radius);
  margin-bottom:12px;
  box-shadow:var(--shadow);
  overflow:hidden;
  transition:box-shadow .2s;
}
.section:hover{box-shadow:var(--shadow-lg)}

.sec-head{
  width:100%;
  display:flex; align-items:center; gap:14px;
  padding:16px 18px;
  background:transparent;
  border:0;
  cursor:pointer;
  text-align:start;
  font:inherit; color:var(--ink);
  transition:background .15s;
}
.sec-head:hover{background:rgba(60,45,30,.025)}

.sec-icon{
  flex:0 0 auto;
  width:42px; height:42px;
  display:grid; place-items:center;
  font-size:20px;
  border-radius:10px;
  background:var(--teal-50);
  color:var(--teal-700);
  border:1px solid var(--teal-100);
}
.section.cls-amber  .sec-icon{background:var(--amber-50);  color:var(--amber-700);  border-color:var(--amber-100)}
.section.cls-rose   .sec-icon{background:var(--rose-50);   color:var(--rose-700);   border-color:var(--rose-100)}
.section.cls-indigo .sec-icon{background:var(--indigo-50); color:var(--indigo-700); border-color:var(--indigo-100)}

.sec-title{
  flex:1;
  font-size:16.5px;
  font-weight:600;
  letter-spacing:-.005em;
  line-height:1.35;
}
.sec-num{
  font-size:11px;
  font-weight:700;
  color:var(--muted);
  letter-spacing:.06em;
  margin-bottom:2px;
  text-transform:uppercase;
}
.sec-arrow{
  flex:0 0 auto;
  width:24px;height:24px;
  display:grid; place-items:center;
  color:var(--muted);
  transition:transform .25s;
  font-size:14px;
}
.section.open .sec-arrow{transform:rotate(180deg)}
body[dir=rtl] .sec-arrow{transform:none}
body[dir=rtl] .section.open .sec-arrow{transform:rotate(-180deg)}

.sec-body{
  display:none;
  padding:0 22px 22px;
  border-top:1px solid var(--line-2);
}
.section.open .sec-body{display:block; animation:slideDown .25s ease}
@keyframes slideDown{
  from{opacity:0; transform:translateY(-4px)}
  to{opacity:1; transform:translateY(0)}
}

.sec-body p{margin:14px 0; color:var(--ink); font-size:15.5px; line-height:1.7}
.sec-body ul, .sec-body ol{margin:12px 0; padding-inline-start:22px}
.sec-body li{margin:7px 0; line-height:1.65; font-size:15px}
.sec-body strong{color:var(--teal-900); font-weight:700}
.section.cls-amber  .sec-body strong{color:var(--amber-700)}
.section.cls-rose   .sec-body strong{color:var(--rose-700)}
.section.cls-indigo .sec-body strong{color:var(--indigo-700)}
.sec-body em{color:var(--ink2); font-style:italic; display:inline-block; margin-top:6px}

.sec-img{
  width:100%;
  border-radius:10px;
  margin:18px 0 4px;
  display:block;
  box-shadow:0 2px 8px rgba(40,30,20,.08);
  background:#fff;
}

/* ── Footer ────────────────────── */
.foot{
  text-align:center;
  font-size:12.5px;
  color:var(--muted);
  padding:36px 18px 0;
  line-height:1.7;
}

/* ── Responsive ────────────────── */
@media (max-width:520px){
  .hero{padding:30px 20px 40px}
  .hero h1{font-size:26px}
  .container{padding:18px 14px 60px}
  .sec-head{padding:14px 14px}
  .sec-body{padding:0 16px 18px}
  .sec-icon{width:38px;height:38px;font-size:18px}
  .sec-title{font-size:15px}
}
</style>
</head>
<body lang="he" dir="rtl">

<header class="hero">
  <div class="brand"><span class="brand-dot"></span><span data-ui="brand">Hub2Care</span></div>
  <h1 data-ui="header_title"></h1>
  <p class="subtitle" data-ui="header_subtitle"></p>
  <span class="tagline" data-ui="tagline"></span>
  <p class="disclaimer" data-ui="disclaimer"></p>
</header>

<nav class="langbar" id="langbar"></nav>

<main class="container">
  <div class="controls">
    <button class="ctrl-btn" id="expandBtn" data-ui="expand_all"></button>
    <button class="ctrl-btn" id="collapseBtn" data-ui="collapse_all"></button>
  </div>
  <div id="sections"></div>
  <div class="back-wrap">
    <button class="back-btn" id="backBtn" type="button">
      <span class="back-arrow">↑</span>
      <span data-ui="back_to_top"></span>
    </button>
  </div>
  <p class="foot" data-ui="footer"></p>
</main>

<script>
const APP = {"sections": [{"id": "purpose", "icon": "🎯", "cls": "teal", "img": null, "titles": {"he": "מטרת ההחלפה", "en": "Purpose of the change", "ru": "Цель смены подгузника", "ml": "ഡയപ്പർ മാറ്റലിന്റെ ഉദ്ദേശ്യം", "tl": "Layunin ng pagpapalit ng diaper"}, "body": {"he": "<p>החלפת חיתול אינה רק פעולה טכנית. היא פעולה של שמירה על <strong>כבוד</strong> המטופל, מניעת זיהומים ופצעי לחץ, שמירה על עור בריא, ושמירה על הבטיחות שלך ושל המטופל.</p><p>המטפל עובד <strong>לאט</strong>, מסביר כל שלב, ואינו מבצע פעולה בכוח. אם המטופל מתנגד, מרגיש כאב או חוסר נוחות — עוצרים, רוגעים, ומתחילים שוב.</p>", "en": "<p>Changing a diaper is not only a technical task. It is an act of preserving the patient's <strong>dignity</strong>, preventing infections and pressure sores, protecting healthy skin, and keeping both you and the patient safe.</p><p>The caregiver works <strong>slowly</strong>, explains every step, and never uses force. If the patient resists, feels pain, or seems uncomfortable — stop, calm down, and start again.</p>", "ru": "<p>Смена подгузника — это не только техническая процедура. Это сохранение <strong>достоинства</strong> подопечного, предупреждение инфекций и пролежней, защита кожи и обеспечение безопасности — вашей и его.</p><p>Работайте <strong>медленно</strong>, объясняйте каждый шаг и никогда не применяйте силу. Если человек сопротивляется, чувствует боль или дискомфорт — остановитесь, успокойтесь и начните снова.</p>", "ml": "<p>ഡയപ്പർ മാറ്റൽ ഒരു സാങ്കേതിക ജോലി മാത്രമല്ല. അത് രോഗിയുടെ <strong>മാന്യത</strong> സംരക്ഷിക്കാനും, അണുബാധയും ബെഡ് സോറുകളും തടയാനും, ചർമ്മത്തെ ആരോഗ്യത്തോടെ നിലനിർത്താനും, നിങ്ങളുടെയും രോഗിയുടെയും സുരക്ഷ ഉറപ്പാക്കാനുമുള്ള പ്രവൃത്തിയാണ്.</p><p>പരിചരകൻ <strong>സാവധാനം</strong> പ്രവർത്തിക്കുന്നു, ഓരോ ഘട്ടവും വിശദീകരിക്കുന്നു, ഒരിക്കലും ബലപ്രയോഗം നടത്തുന്നില്ല. രോഗി എതിർക്കുകയോ, വേദന അനുഭവിക്കുകയോ, അസ്വസ്ഥത തോന്നുകയോ ചെയ്താൽ — നിർത്തുക, ശാന്തമാകുക, വീണ്ടും തുടങ്ങുക.</p>", "tl": "<p>Ang pagpapalit ng diaper ay hindi lamang teknikal na gawain. Ito ay pag-iingat sa <strong>dignidad</strong> ng pasyente, pag-iwas sa impeksyon at bedsores, pag-aalaga sa malusog na balat, at pag-iingat sa kaligtasan mo at ng pasyente.</p><p>Ang tagapag-alaga ay nagtatrabaho nang <strong>dahan-dahan</strong>, ipinapaliwanag ang bawat hakbang, at hindi kailanman gumagamit ng pwersa. Kung lumalaban ang pasyente, may sakit, o hindi komportable — huminto, kumalma, at magsimula muli.</p>"}}, {"id": "timing", "icon": "⏰", "cls": "teal", "img": "timing", "titles": {"he": "תזמון: מתי מחליפים חיתול", "en": "Timing: When to change the diaper", "ru": "Когда менять подгузник", "ml": "എപ്പോൾ ഡയപ്പർ മാറ്റണം", "tl": "Kailan dapat palitan ang diaper"}, "body": {"he": "<p>לא ממתינים למצב קיצוני. ההחלפה נעשית בזמן הנכון:</p><ul><li><strong>אחרי כל יציאה צואתית</strong> — מיד, ללא דיחוי.</li><li><strong>כאשר החיתול רטוב מאוד</strong> או יש דליפה.</li><li><strong>כל 4–6 שעות</strong> במשך היום — גם אם החיתול לא נראה מלא, השתן עדיין רטוב את העור ועלול לגרום לתפרחת ופצעי לחץ.</li><li><strong>לפני ארוחה</strong> או לפני שהמטופל הולך לישון.</li><li><strong>בלילה</strong> — אם המטופל מתעורר רטוב או יש ריח חזק.</li></ul><p>חיתול שעמד שעות רבות הוא אחת הסיבות העיקריות לפצעי לחץ ולתפרחת חמורה. אל תחכה ל\"מצב חירום\".</p>", "en": "<p>Do not wait until the situation is extreme. Change at the right times:</p><ul><li><strong>Immediately after every bowel movement</strong> — without delay.</li><li><strong>When the diaper is very wet</strong> or leaking.</li><li><strong>Every 4–6 hours</strong> during the day — even if the diaper does not look full. Urine still wets the skin and can cause rashes and pressure sores.</li><li><strong>Before a meal</strong> or before the patient goes to sleep.</li><li><strong>At night</strong> — if the patient wakes up wet or there is a strong smell.</li></ul><p>A diaper left on for many hours is one of the main causes of pressure sores and severe rashes. Do not wait for an \"emergency\".</p>", "ru": "<p>Не ждите крайней ситуации. Меняйте подгузник вовремя:</p><ul><li><strong>Сразу после каждого опорожнения</strong> — без промедления.</li><li><strong>Когда подгузник сильно мокрый</strong> или протекает.</li><li><strong>Каждые 4–6 часов</strong> в течение дня — даже если подгузник не выглядит полным. Моча всё равно мочит кожу и может вызвать сыпь и пролежни.</li><li><strong>Перед едой</strong> или перед сном.</li><li><strong>Ночью</strong> — если человек проснулся мокрым или появился резкий запах.</li></ul><p>Подгузник, оставленный на много часов, — одна из главных причин пролежней и тяжёлой сыпи. Не ждите «крайней ситуации».</p>", "ml": "<p>അവസ്ഥ കൂടുതൽ വഷളാകുന്നതുവരെ കാത്തിരിക്കരുത്. ശരിയായ സമയത്ത് മാറ്റുക:</p><ul><li><strong>ഓരോ മലവിസർജനത്തിന് ശേഷവും</strong> — ഉടനെ, വൈകാതെ.</li><li><strong>ഡയപ്പർ വളരെ നനഞ്ഞിരിക്കുമ്പോൾ</strong> അല്ലെങ്കിൽ ലീക്ക് ചെയ്യുമ്പോൾ.</li><li><strong>പകൽ ഓരോ 4–6 മണിക്കൂറിലും</strong> — ഡയപ്പർ നിറഞ്ഞതായി കാണുന്നില്ലെങ്കിലും. മൂത്രം ചർമ്മത്തെ നനയ്ക്കുകയും തിണർപ്പും ബെഡ് സോറുകളും ഉണ്ടാക്കുകയും ചെയ്യും.</li><li><strong>ഭക്ഷണത്തിന് മുമ്പ്</strong> അല്ലെങ്കിൽ ഉറങ്ങാൻ പോകുന്നതിന് മുമ്പ്.</li><li><strong>രാത്രിയിൽ</strong> — രോഗി നനഞ്ഞ് ഉണരുകയോ ശക്തമായ ദുർഗന്ധം ഉണ്ടാകുകയോ ചെയ്താൽ.</li></ul><p>മണിക്കൂറുകളോളം മാറ്റാത്ത ഡയപ്പർ ബെഡ് സോറുകളുടെയും ഗുരുതരമായ തിണർപ്പിന്റെയും പ്രധാന കാരണങ്ങളിലൊന്നാണ്. \"അടിയന്തിര അവസ്ഥ\"യ്ക്കായി കാത്തിരിക്കരുത്.</p>", "tl": "<p>Huwag maghintay hanggang sumobra ang sitwasyon. Magpalit sa tamang oras:</p><ul><li><strong>Pagkatapos ng bawat pagdumi</strong> — agad, walang pagkaantala.</li><li><strong>Kapag basang-basa na ang diaper</strong> o tumatagas.</li><li><strong>Tuwing 4–6 na oras</strong> sa araw — kahit hindi puno ang diaper. Ang ihi ay basa pa rin sa balat at maaaring magdulot ng pantal at bedsores.</li><li><strong>Bago kumain</strong> o bago matulog ang pasyente.</li><li><strong>Sa gabi</strong> — kung gising ang pasyente at basa, o may malakas na amoy.</li></ul><p>Ang diaper na hindi pinalitan ng maraming oras ay isa sa pangunahing dahilan ng bedsores at matinding pantal. Huwag hintaying maging \"emergency\".</p>"}}, {"id": "prepare", "icon": "🧺", "cls": "teal", "img": "prepare", "titles": {"he": "הכנת סביבה וציוד", "en": "Preparing the environment and equipment", "ru": "Подготовка пространства и принадлежностей", "ml": "അന്തരീക്ഷവും സാധനങ്ങളും തയ്യാറാക്കുക", "tl": "Paghahanda ng lugar at gamit"}, "body": {"he": "<p>לפני שמתחילים, מכינים <strong>הכל</strong> מראש. אסור לעזוב את המטופל באמצע פעולה כדי לחפש מגבון או חיתול.</p><p><strong>סביבה:</strong></p><ul><li>פרטיות מלאה — לסגור דלת או וילון.</li><li>תאורה טובה — חייבים לראות את העור היטב.</li><li>חימום החדר אם המטופל קר.</li><li>גובה המיטה — אם אפשר, להגביה למצב נוח לעבודה כדי לא לפגוע בגב שלך.</li></ul><p><strong>ציוד שיש להכין מראש:</strong></p><ul><li>חיתול נקי בגודל מתאים</li><li>מגבונים לחים או מטליות רכות</li><li>מים פושרים בקערה</li><li>סבון עדין (אם נדרש)</li><li>מגבת רכה לייבוש</li><li>קרם מחסום (Barrier Cream)</li><li>שקית אשפה סגורה</li><li>כפפות חד-פעמיות (לפחות זוג אחד, רצוי שניים)</li><li>בגדים נקיים אם צריך</li></ul>", "en": "<p>Before you start, prepare <strong>everything</strong> in advance. Never leave the patient mid-task to fetch a wipe or a diaper.</p><p><strong>Environment:</strong></p><ul><li>Full privacy — close the door or curtain.</li><li>Good lighting — you must see the skin clearly.</li><li>Warm the room if the patient feels cold.</li><li>Bed height — if possible, raise it to a comfortable working level to protect your back.</li></ul><p><strong>Equipment to prepare in advance:</strong></p><ul><li>Clean diaper of the right size</li><li>Wet wipes or soft cloths</li><li>Lukewarm water in a basin</li><li>Mild soap (if needed)</li><li>Soft towel for drying</li><li>Barrier cream</li><li>Sealed waste bag</li><li>Disposable gloves (at least one pair, ideally two)</li><li>Clean clothes if needed</li></ul>", "ru": "<p>Перед началом подготовьте <strong>всё</strong> заранее. Нельзя оставлять подопечного во время процедуры, чтобы достать салфетку или подгузник.</p><p><strong>Пространство:</strong></p><ul><li>Полная приватность — закройте дверь или штору.</li><li>Хорошее освещение — кожу нужно видеть чётко.</li><li>Тёплая комната, если пациенту холодно.</li><li>Высота кровати — если возможно, поднимите до удобного уровня, чтобы беречь спину.</li></ul><p><strong>Что подготовить заранее:</strong></p><ul><li>Чистый подгузник нужного размера</li><li>Влажные салфетки или мягкие тряпочки</li><li>Тёплая вода в тазике</li><li>Мягкое мыло (при необходимости)</li><li>Мягкое полотенце для сушки</li><li>Барьерный крем</li><li>Закрытый мусорный пакет</li><li>Одноразовые перчатки (минимум одна пара, лучше две)</li><li>Чистая одежда при необходимости</li></ul>", "ml": "<p>തുടങ്ങുന്നതിന് മുമ്പ്, <strong>എല്ലാം</strong> മുൻകൂട്ടി തയ്യാറാക്കുക. വൈപ്പോ ഡയപ്പറോ എടുക്കാൻ പോകുമ്പോൾ രോഗിയെ ഒറ്റയ്ക്ക് വിടരുത്.</p><p><strong>അന്തരീക്ഷം:</strong></p><ul><li>പൂർണ്ണ സ്വകാര്യത — വാതിലോ കർട്ടനോ അടയ്ക്കുക.</li><li>നല്ല വെളിച്ചം — ചർമ്മം വ്യക്തമായി കാണണം.</li><li>രോഗിക്ക് തണുപ്പുണ്ടെങ്കിൽ മുറി ചൂടാക്കുക.</li><li>കിടക്കയുടെ ഉയരം — സാധ്യമെങ്കിൽ, നിങ്ങളുടെ പുറംപുറം സംരക്ഷിക്കാൻ സൗകര്യപ്രദമായ ഉയരത്തിലേക്ക് ഉയർത്തുക.</li></ul><p><strong>മുൻകൂട്ടി തയ്യാറാക്കേണ്ട സാധനങ്ങൾ:</strong></p><ul><li>ശരിയായ വലുപ്പത്തിലുള്ള വൃത്തിയുള്ള ഡയപ്പർ</li><li>വെറ്റ് വൈപ്സ് അല്ലെങ്കിൽ മൃദുവായ തുണികൾ</li><li>ഇളംചൂടുള്ള വെള്ളം ഒരു ബേസിനിൽ</li><li>മൃദുവായ സോപ്പ് (ആവശ്യമെങ്കിൽ)</li><li>ഉണക്കാൻ മൃദുവായ ടവൽ</li><li>ബാരിയർ ക്രീം</li><li>അടച്ച മാലിന്യ ബാഗ്</li><li>ഡിസ്പോസിബിൾ കയ്യുറകൾ (ചുരുങ്ങിയത് ഒരു ജോഡി, രണ്ട് ജോഡി ഉത്തമം)</li><li>ആവശ്യമെങ്കിൽ വൃത്തിയുള്ള വസ്ത്രം</li></ul>", "tl": "<p>Bago magsimula, ihanda ang <strong>lahat</strong> nang maaga. Huwag iiwan ang pasyente sa gitna ng pagpapalit para kumuha ng wipe o diaper.</p><p><strong>Lugar:</strong></p><ul><li>Buong privacy — isara ang pinto o kurtina.</li><li>Maliwanag — kailangan kitang-kita ang balat.</li><li>Painitin ang kuwarto kung giniginaw ang pasyente.</li><li>Taas ng kama — kung kaya, itaas sa komportableng level para hindi masakit ang likod mo.</li></ul><p><strong>Mga gamit na ihahanda:</strong></p><ul><li>Malinis na diaper na tamang sukat</li><li>Wet wipes o malambot na tela</li><li>Maligamgam na tubig sa palanggana</li><li>Banayad na sabon (kung kailangan)</li><li>Malambot na tuwalya pang-tuyo</li><li>Barrier cream</li><li>Saradong basurahang plastik</li><li>Disposable na guwantes (kahit isang pares, mas mabuti dalawa)</li><li>Malinis na damit kung kailangan</li></ul>"}}, {"id": "hygiene", "icon": "🧤", "cls": "indigo", "img": null, "titles": {"he": "היגיינה ובטיחות שלך", "en": "Your hygiene and safety", "ru": "Ваша гигиена и безопасность", "ml": "നിങ്ങളുടെ ശുചിത്വവും സുരക്ഷയും", "tl": "Iyong hygiene at kaligtasan"}, "body": {"he": "<p>אתה לא רק שומר על המטופל — אתה גם שומר על עצמך.</p><ul><li><strong>שטיפת ידיים</strong> במים וסבון <strong>לפני</strong> ההחלפה ו<strong>אחרי</strong> ההחלפה — תמיד.</li><li><strong>כפפות חד-פעמיות</strong> בכל החלפה.</li><li>אם נתקלת ב<strong>צואה משמעותית</strong> — להחליף כפפות באמצע: להוריד את הזוג המלוכלך, לשטוף ידיים, ולחבוש זוג חדש לפני שמלבישים את החיתול הנקי.</li><li>אם יש <strong>פצע פתוח על העור שלך</strong> (חתך, שריטה) — לכסות בפלסטר עמיד למים מתחת לכפפה.</li><li>אסור לגעת בפנים, באוכל או בטלפון בזמן שאתה לובש כפפות.</li><li>חיתול משומש — תמיד נכנס לשקית סגורה ומיד לפח. לא מניחים על הרצפה או על המיטה.</li></ul>", "en": "<p>You are not only protecting the patient — you are also protecting yourself.</p><ul><li><strong>Wash your hands</strong> with soap and water <strong>before</strong> and <strong>after</strong> every change — always.</li><li><strong>Disposable gloves</strong> for every change.</li><li>If you encounter <strong>significant stool</strong> — change gloves mid-task: remove the soiled pair, wash hands, and put on a fresh pair before fitting the clean diaper.</li><li>If you have an <strong>open wound</strong> on your skin (cut, scratch) — cover it with a waterproof bandage under the glove.</li><li>Do not touch your face, food, or phone while wearing gloves.</li><li>Used diapers always go into a sealed bag and straight to the bin. Never on the floor or the bed.</li></ul>", "ru": "<p>Вы защищаете не только подопечного — вы защищаете и себя.</p><ul><li><strong>Мойте руки</strong> с мылом <strong>до</strong> и <strong>после</strong> каждой смены — всегда.</li><li><strong>Одноразовые перчатки</strong> при каждой смене.</li><li>Если есть <strong>обильный стул</strong> — меняйте перчатки в середине процедуры: снимите грязные, вымойте руки и наденьте новые перед тем, как надеть чистый подгузник.</li><li>Если на вашей коже <strong>открытая рана</strong> (порез, царапина) — заклейте её водонепроницаемым пластырем под перчаткой.</li><li>Не прикасайтесь к лицу, еде или телефону, пока на вас перчатки.</li><li>Использованный подгузник — всегда в закрытый пакет и сразу в мусор. Никогда не на пол или на кровать.</li></ul>", "ml": "<p>നിങ്ങൾ രോഗിയെ മാത്രമല്ല സംരക്ഷിക്കുന്നത് — സ്വയവും സംരക്ഷിക്കുന്നു.</p><ul><li><strong>കൈ കഴുകുക</strong> സോപ്പും വെള്ളവും ഉപയോഗിച്ച് ഓരോ മാറ്റത്തിന് <strong>മുമ്പും ശേഷവും</strong> — എപ്പോഴും.</li><li>ഓരോ മാറ്റത്തിലും <strong>ഡിസ്പോസിബിൾ കയ്യുറകൾ</strong>.</li><li><strong>കാര്യമായ മലം</strong> ഉണ്ടെങ്കിൽ — ഇടയിൽ കയ്യുറ മാറ്റുക: വൃത്തികെട്ട ജോഡി ഊരി, കൈ കഴുകി, ശുദ്ധമായ ഡയപ്പർ ഇടുന്നതിന് മുമ്പ് പുതിയ ജോഡി ധരിക്കുക.</li><li>നിങ്ങളുടെ ചർമ്മത്തിൽ <strong>തുറന്ന മുറിവ്</strong> ഉണ്ടെങ്കിൽ (മുറിവ്, പോറൽ) — കയ്യുറയ്ക്ക് താഴെ വാട്ടർപ്രൂഫ് ബാൻഡേജ് കൊണ്ട് മൂടുക.</li><li>കയ്യുറ ധരിച്ചിരിക്കുമ്പോൾ മുഖത്തോ, ഭക്ഷണത്തിലോ, ഫോണിലോ തൊടരുത്.</li><li>ഉപയോഗിച്ച ഡയപ്പർ എല്ലായ്പ്പോഴും ഒരു അടച്ച ബാഗിൽ ഇട്ട് നേരെ ചവറ്റുകുട്ടയിലേക്ക്. ഒരിക്കലും തറയിലോ കിടക്കയിലോ വയ്ക്കരുത്.</li></ul>", "tl": "<p>Hindi lang ang pasyente ang iyong iniingatan — iniingatan mo rin ang sarili mo.</p><ul><li><strong>Maghugas ng kamay</strong> sa sabon at tubig <strong>bago</strong> at <strong>pagkatapos</strong> ng bawat pagpapalit — palagi.</li><li><strong>Disposable na guwantes</strong> sa bawat pagpapalit.</li><li>Kung may <strong>malaking dumi</strong> — palitan ang guwantes sa gitna: tanggalin ang marumi, maghugas ng kamay, at magsuot ng bago bago isuot ang malinis na diaper.</li><li>Kung may <strong>bukas na sugat</strong> sa balat mo (hiwa, gasgas) — takpan ng waterproof bandage sa ilalim ng guwantes.</li><li>Huwag hawakan ang mukha, pagkain, o cellphone habang nakaguwantes ka.</li><li>Ang ginamit na diapers ay laging nasa saradong bag at deretso sa basurahan. Huwag sa sahig o sa kama.</li></ul>"}}, {"id": "explain", "icon": "🗣️", "cls": "teal", "img": "explain", "titles": {"he": "הסבר למטופל לפני הפעולה", "en": "Explain to the patient before you start", "ru": "Объясните подопечному перед началом", "ml": "തുടങ്ങുന്നതിന് മുമ്പ് രോഗിയോട് വിശദീകരിക്കുക", "tl": "Ipaliwanag sa pasyente bago magsimula"}, "body": {"he": "<p>גם אם המטופל אינו מגיב, אינו מדבר, או סובל מדמנציה — <strong>מסבירים תמיד</strong>. השמיעה והתחושה לרוב נשמרות.</p><p>לפני שאתה מרים את השמיכה או נוגע בו, אומר בקול רגוע: \"אני הולך/ת להחליף לך עכשיו את החיתול. זה לוקח רק כמה דקות.\"</p><p>במהלך הפעולה — מסביר כל שלב מראש: \"אני מסובב אותך עכשיו על הצד\", \"אני מנקה עכשיו\". זה <strong>מפחית פחד</strong>, מבוכה והתנגדות.</p><p>אם יש מבוכה — אפשר להסיח את דעתו: לדבר על מזג האוויר, על משפחה, להפעיל רדיו. שומרים על קשר עין רגוע, חיוך, וטון נעים.</p><p><strong>שומרים על כבוד:</strong> מכסים את חלקי הגוף שאינם נדרשים לפעולה. אסור להשאיר את המטופל חשוף יותר מהנדרש.</p>", "en": "<p>Even if the patient does not respond, does not speak, or has dementia — <strong>always explain</strong>. Hearing and feeling are usually preserved.</p><p>Before lifting the blanket or touching them, say in a calm voice: \"I am going to change your diaper now. It will only take a few minutes.\"</p><p>During the procedure — narrate each step before doing it: \"I am turning you on your side now\", \"I am cleaning now\". This <strong>reduces fear</strong>, embarrassment, and resistance.</p><p>If there is embarrassment — distract gently: talk about the weather, family, or play the radio. Keep calm eye contact, a soft smile, and a pleasant tone.</p><p><strong>Preserve dignity:</strong> cover the parts of the body that are not currently being cleaned. Never leave the patient exposed longer than necessary.</p>", "ru": "<p>Даже если человек не отвечает, не говорит или страдает деменцией — <strong>всегда объясняйте</strong>. Слух и тактильные ощущения обычно сохраняются.</p><p>Перед тем как поднять одеяло или прикоснуться, скажите спокойным голосом: «Я сейчас поменяю тебе подгузник. Это займёт всего несколько минут».</p><p>Во время процедуры — называйте каждое действие заранее: «Я сейчас поверну тебя на бок», «Сейчас я очищу». Это <strong>уменьшает страх</strong>, смущение и сопротивление.</p><p>При смущении можно мягко отвлечь: говорите о погоде, о семье, включите радио. Сохраняйте спокойный взгляд, лёгкую улыбку и приятный тон.</p><p><strong>Сохраняйте достоинство:</strong> прикрывайте те части тела, которые не задействованы в данный момент. Не оставляйте человека открытым дольше необходимого.</p>", "ml": "<p>രോഗി പ്രതികരിക്കുന്നില്ലെങ്കിലും, സംസാരിക്കുന്നില്ലെങ്കിലും, ഡിമൻഷ്യ ഉണ്ടെങ്കിലും — <strong>എപ്പോഴും വിശദീകരിക്കുക</strong>. കേൾവിയും സ്പർശനവും സാധാരണയായി നിലനിൽക്കും.</p><p>പുതപ്പ് ഉയർത്തുന്നതിനോ സ്പർശിക്കുന്നതിനോ മുമ്പ്, ശാന്തമായ ശബ്ദത്തിൽ പറയുക: \"ഞാൻ ഇപ്പോൾ നിങ്ങളുടെ ഡയപ്പർ മാറ്റാൻ പോകുകയാണ്. കുറച്ച് മിനിറ്റ് മാത്രമേ എടുക്കൂ.\"</p><p>പ്രക്രിയയിൽ — ഓരോ ഘട്ടവും ചെയ്യുന്നതിന് മുമ്പ് പറയുക: \"ഞാൻ ഇപ്പോൾ നിങ്ങളെ ഒരു വശത്തേക്ക് തിരിക്കുന്നു\", \"ഇപ്പോൾ വൃത്തിയാക്കുന്നു\". ഇത് <strong>ഭയം</strong>, ലജ്ജ, എതിർപ്പ് എന്നിവ കുറയ്ക്കുന്നു.</p><p>ലജ്ജ ഉണ്ടെങ്കിൽ — സൗമ്യമായി ശ്രദ്ധ തിരിക്കുക: കാലാവസ്ഥയെക്കുറിച്ച്, കുടുംബത്തെക്കുറിച്ച് സംസാരിക്കുക, റേഡിയോ ഓൺ ചെയ്യുക. ശാന്തമായ കണ്ണുകൾ, മൃദുവായ പുഞ്ചിരി, സുഖകരമായ ടോൺ നിലനിർത്തുക.</p><p><strong>മാന്യത സംരക്ഷിക്കുക:</strong> അപ്പോൾ വൃത്തിയാക്കാത്ത ശരീരഭാഗങ്ങൾ മൂടുക. ആവശ്യമുള്ളതിലധികം സമയം രോഗിയെ തുറന്നിടരുത്.</p>", "tl": "<p>Kahit hindi sumasagot ang pasyente, hindi nagsasalita, o may dementia — <strong>palaging ipaliwanag</strong>. Karaniwan, gising pa rin ang pandinig at pakiramdam.</p><p>Bago itaas ang kumot o hawakan siya, sabihin sa mahinahong boses: \"Papalitan ko na po ang diaper niyo. Ilang minuto lang.\"</p><p>Habang ginagawa — sabihin muna bago gawin ang bawat hakbang: \"Ibabaling ko po kayo sa tabi ngayon\", \"Lilinisin ko na po\". Pinapababa nito ang <strong>takot</strong>, hiya, at paglaban.</p><p>Kung may hiya — banayad na ilihis ang isip: kausapin tungkol sa panahon, pamilya, o paandarin ang radyo. Panatilihin ang mahinahong tingin, malumanay na ngiti, at masayang tono.</p><p><strong>Ingatan ang dignidad:</strong> takpan ang mga bahagi ng katawan na hindi nililinis sa sandaling iyon. Huwag hayaang nakabukas ang pasyente nang mas matagal kaysa kailangan.</p>"}}, {"id": "technique", "icon": "🔄", "cls": "indigo", "img": "technique", "titles": {"he": "טכניקת ההחלפה — שלב אחר שלב", "en": "Technique — step by step", "ru": "Техника смены — шаг за шагом", "ml": "ടെക്നിക് — ഘട്ടം ഘട്ടമായി", "tl": "Tamang paraan — hakbang-hakbang"}, "body": {"he": "<p>זו הפעולה הקריטית. עובדים <strong>לאט, בעדינות, ללא משיכות חדות</strong>.</p><ol><li><strong>פותחים את החיתול המלוכלך</strong> בצדדים (מסירים את המדבקות), אך לא מורידים אותו עדיין.</li><li><strong>אם יש צואה</strong> — מנקים את הניקוי הראשוני בחלק הקדמי בחיתול עצמו, לפני שמסירים אותו. זה מונע התלכלכות נוספת.</li><li><strong>מסובבים את המטופל בעדינות על הצד</strong> — מבקשים שיכופף את הברך, אם הוא יכול. ביד אחת תומכים בכתף, ביד השנייה מסיטים את האגן. <em>אסור למשוך בזרוע</em>.</li><li><strong>מגלגלים את החיתול המלוכלך פנימה</strong> כך שהצד המלוכלך נשאר בפנים, ומסיטים אותו לאחור.</li><li><strong>מנקים את המטופל</strong> מלפנים לאחור (פירוט בפרק הבא).</li><li><strong>מייבשים היטב</strong> כל הקפלים — קריטי.</li><li><strong>מניחים חיתול נקי</strong> פתוח מתחת למטופל בצד הנכון: החצי האחורי שלו תחת האגן.</li><li><strong>מסובבים את המטופל בעדינות לצד השני</strong>, מורידים את החיתול המלוכלך לשקית, ופותחים את החצי הקדמי של החיתול הנקי תחתיו.</li><li><strong>מחזירים את המטופל לתנוחת גב</strong>, מושכים את החצי הקדמי של החיתול בין הרגליים מעלה.</li><li><strong>סוגרים את המדבקות</strong> בכיוון מהאחור לפנים, באלכסון קל כלפי מעלה. החיתול צריך להיות <strong>צמוד אבל לא לוחץ</strong> — אצבע אחת חייבת להיכנס בקלות בין החיתול לבטן.</li><li><strong>בודקים שאין קיפולים</strong> בקפלי הירכיים, ושהבד הפנימי המגן (the inner cuff) פונה החוצה ולא פנימה. קיפול פנימי גורם לדליפות.</li></ol><p><strong>שני מטפלים:</strong> אם המטופל כבד, חסר יציבות, או אינו יכול לשתף פעולה — לעולם אל תעבוד לבד. בקש עזרה.</p>", "en": "<p>This is the critical step. Work <strong>slowly, gently, with no sharp pulls</strong>.</p><ol><li><strong>Open the soiled diaper</strong> at the sides (release the tabs), but do not remove it yet.</li><li><strong>If there is stool</strong> — do an initial wipe at the front using the diaper itself, before removing it. This prevents further mess.</li><li><strong>Gently roll the patient onto the side</strong> — ask them to bend the knee if they can. Support the shoulder with one hand and guide the hip with the other. <em>Do not pull on the arm.</em></li><li><strong>Roll the soiled diaper inward</strong> so the dirty side stays inside, and tuck it toward the back.</li><li><strong>Clean the patient</strong> from front to back (full details in the next section).</li><li><strong>Dry every skin fold thoroughly</strong> — this is critical.</li><li><strong>Place a clean diaper open</strong> under the patient: the back half goes under the hip.</li><li><strong>Gently roll the patient to the other side</strong>, drop the soiled diaper into the bag, and pull the front half of the clean diaper through.</li><li><strong>Roll the patient back onto their back</strong>, pull the front half of the diaper up between the legs.</li><li><strong>Fasten the tabs</strong> from back to front, slightly angled upward. The diaper should be <strong>snug but not tight</strong> — one finger must slide easily between the diaper and the belly.</li><li><strong>Check for folds</strong> at the leg openings, and make sure the inner protective cuffs face outward, not inward. An inward fold causes leaks.</li></ol><p><strong>Two caregivers:</strong> if the patient is heavy, unstable, or cannot cooperate — never work alone. Ask for help.</p>", "ru": "<p>Это ключевой этап. Работайте <strong>медленно, мягко, без резких рывков</strong>.</p><ol><li><strong>Расстегните грязный подгузник</strong> по бокам (откройте липучки), но пока не снимайте.</li><li><strong>Если есть стул</strong> — сначала вытрите спереди самим подгузником, до того как снять его. Это предотвращает дальнейшее загрязнение.</li><li><strong>Аккуратно поверните подопечного на бок</strong> — попросите согнуть колено, если он может. Одной рукой поддержите плечо, другой направляйте бедро. <em>Не тяните за руку.</em></li><li><strong>Сверните грязный подгузник внутрь</strong>, чтобы грязная сторона осталась внутри, и подведите его назад.</li><li><strong>Очистите подопечного</strong> спереди назад (подробности — в следующем разделе).</li><li><strong>Тщательно высушите все складки</strong> — это критически важно.</li><li><strong>Положите чистый подгузник</strong> раскрытым под подопечного: задняя половина — под бедро.</li><li><strong>Осторожно поверните подопечного на другой бок</strong>, бросьте грязный подгузник в пакет и вытяните переднюю половину чистого подгузника.</li><li><strong>Верните подопечного на спину</strong>, протяните переднюю часть подгузника между ног наверх.</li><li><strong>Застегните липучки</strong> от спины к животу, слегка под углом вверх. Подгузник должен <strong>прилегать, но не давить</strong> — один палец должен свободно входить между подгузником и животом.</li><li><strong>Проверьте, нет ли складок</strong> у ножных манжет, и убедитесь, что внутренние защитные манжеты направлены наружу, а не внутрь. Внутренний загиб вызывает протечки.</li></ol><p><strong>Два человека:</strong> если подопечный тяжёлый, нестабильный или не может сотрудничать — никогда не работайте в одиночку. Попросите помощи.</p>", "ml": "<p>ഇത് നിർണായക ഘട്ടമാണ്. <strong>സാവധാനം, സൗമ്യമായി, പെട്ടെന്നുള്ള വലികളില്ലാതെ</strong> പ്രവർത്തിക്കുക.</p><ol><li><strong>വൃത്തികെട്ട ഡയപ്പറിന്റെ വശങ്ങൾ തുറക്കുക</strong> (ടാബുകൾ വിടുക), പക്ഷേ ഇതുവരെ നീക്കം ചെയ്യരുത്.</li><li><strong>മലം ഉണ്ടെങ്കിൽ</strong> — നീക്കം ചെയ്യുന്നതിന് മുമ്പ് ഡയപ്പർ തന്നെ ഉപയോഗിച്ച് മുൻഭാഗത്ത് ഒരു പ്രാഥമിക തുടക്കൽ നടത്തുക. ഇത് കൂടുതൽ അഴുക്ക് ഒഴിവാക്കും.</li><li><strong>രോഗിയെ സൗമ്യമായി ഒരു വശത്തേക്ക് തിരിക്കുക</strong> — കഴിയുമെങ്കിൽ കാൽമുട്ട് വളയ്ക്കാൻ അദ്ദേഹത്തോട് ആവശ്യപ്പെടുക. ഒരു കൈകൊണ്ട് തോൾ താങ്ങുകയും മറുകൈകൊണ്ട് ഇടുപ്പ് നയിക്കുകയും ചെയ്യുക. <em>കൈയിൽ വലിക്കരുത്.</em></li><li><strong>വൃത്തികെട്ട ഡയപ്പർ അകത്തേക്ക് ചുരുട്ടുക</strong>, അഴുക്ക് ഉൾഭാഗത്ത് നിലനിൽക്കുന്നതുപോലെ, പിന്നിലേക്ക് കൊണ്ടുപോകുക.</li><li><strong>രോഗിയെ വൃത്തിയാക്കുക</strong> മുമ്പിൽ നിന്ന് പിന്നിലേക്ക് (പൂർണ്ണ വിശദാംശങ്ങൾ അടുത്ത വിഭാഗത്തിൽ).</li><li><strong>എല്ലാ ചർമ്മ മടക്കുകളും നന്നായി ഉണക്കുക</strong> — ഇത് നിർണായകമാണ്.</li><li><strong>ഒരു ശുദ്ധമായ ഡയപ്പർ തുറന്ന് വയ്ക്കുക</strong> രോഗിയുടെ കീഴിൽ: പിൻഭാഗം ഇടുപ്പിന് കീഴിൽ.</li><li><strong>രോഗിയെ സൗമ്യമായി മറുവശത്തേക്ക് തിരിക്കുക</strong>, വൃത്തികെട്ട ഡയപ്പർ ബാഗിൽ ഇടുക, ശുദ്ധമായ ഡയപ്പറിന്റെ മുൻഭാഗം വലിക്കുക.</li><li><strong>രോഗിയെ പുറംപുറം തിരികെ കൊണ്ടുവരിക</strong>, ഡയപ്പറിന്റെ മുൻഭാഗം കാലുകൾക്കിടയിലൂടെ മുകളിലേക്ക് വലിക്കുക.</li><li><strong>ടാബുകൾ ഉറപ്പിക്കുക</strong> പിന്നിൽ നിന്ന് മുന്നോട്ട്, അൽപ്പം മുകളിലേക്ക് ചരിച്ച്. ഡയപ്പർ <strong>ഫിറ്റ് ആയിരിക്കണം പക്ഷേ മുറുകണില്ല</strong> — ഒരു വിരൽ ഡയപ്പറിനും വയറിനും ഇടയിൽ എളുപ്പത്തിൽ കടക്കണം.</li><li><strong>കാൽ തുറക്കലിൽ മടക്കുകൾ ഇല്ലെന്ന് പരിശോധിക്കുക</strong>, അകത്തെ സംരക്ഷണ കഫുകൾ പുറത്തേക്ക് അല്ലാതെ അകത്തേക്ക് അല്ല എന്ന് ഉറപ്പാക്കുക. അകത്തേക്കുള്ള മടക്ക് ലീക്ക് ഉണ്ടാക്കും.</li></ol><p><strong>രണ്ട് പരിചരകർ:</strong> രോഗി ഭാരമുള്ളവനാണെങ്കിൽ, അസ്ഥിരനാണെങ്കിൽ, അല്ലെങ്കിൽ സഹകരിക്കാൻ കഴിയാത്തവനാണെങ്കിൽ — ഒറ്റയ്ക്ക് ഒരിക്കലും പ്രവർത്തിക്കരുത്. സഹായം ആവശ്യപ്പെടുക.</p>", "tl": "<p>Ito ang pinakamahalagang bahagi. Magtrabaho nang <strong>dahan-dahan, malumanay, walang biglaang paghila</strong>.</p><ol><li><strong>Buksan ang maruming diaper</strong> sa magkabilang gilid (alisin ang tabs), pero huwag pa itong tanggalin.</li><li><strong>Kung may dumi</strong> — magsimula sa unang pagpunas sa harap gamit ang diaper mismo, bago ito alisin. Iiwasan nito ang dagdag na pagdumi.</li><li><strong>Dahan-dahang ibaling ang pasyente sa tabi</strong> — pakiusapan siyang itiklop ang tuhod kung kaya niya. Suportahan ang balikat ng isang kamay at gabayan ang balakang ng kabila. <em>Huwag hilain ang braso.</em></li><li><strong>Itupi ang maruming diaper papasok</strong> para nasa loob ang maruming bahagi, at itago papunta sa likod.</li><li><strong>Linisin ang pasyente</strong> mula harap papuntang likod (kumpletong detalye sa susunod na seksyon).</li><li><strong>Tuyuin nang lubusan ang lahat ng tupi sa balat</strong> — sobrang importante.</li><li><strong>Maglagay ng malinis na nakabukas na diaper</strong> sa ilalim ng pasyente: ang likurang kalahati ay nasa ilalim ng balakang.</li><li><strong>Dahan-dahang ibaling ang pasyente sa kabilang tabi</strong>, ihulog ang maruming diaper sa basurahang plastik, at hilahin ang harapang kalahati ng malinis na diaper.</li><li><strong>Ibalik ang pasyente sa nakahiga</strong>, hilahin pataas ang harapang kalahati ng diaper sa pagitan ng mga binti.</li><li><strong>Idikit ang tabs</strong> mula likod patungong harap, bahagyang nakatungo paitaas. Ang diaper ay dapat <strong>nakakapit pero hindi masikip</strong> — dapat madaling mailagay ang isang daliri sa pagitan ng diaper at tiyan.</li><li><strong>Tingnan kung walang nakatupi</strong> sa pagitan ng mga binti, at siguraduhing ang panloob na proteksyon (inner cuff) ay nakaharap palabas, hindi papasok. Ang papasok na tupi ay nagiging dahilan ng tagas.</li></ol><p><strong>Dalawang tagapag-alaga:</strong> kung mabigat ang pasyente, hindi matatag, o hindi makasabay — huwag kailanman mag-isa. Humingi ng tulong.</p>"}}, {"id": "clean", "icon": "💧", "cls": "teal", "img": null, "titles": {"he": "ניקוי נכון", "en": "Cleaning correctly", "ru": "Правильное очищение", "ml": "ശരിയായ വൃത്തിയാക്കൽ", "tl": "Tamang paglilinis"}, "body": {"he": "<p>הניקוי הוא לב הפעולה. עור נקי ויבש = עור בריא.</p><p><strong>אישה:</strong> מנקים תמיד <strong>מלפנים לאחור</strong> — מהאזור הקדמי לכיוון פי הטבעת. אסור לחזור עם אותו מגבון אחורה ואז קדימה — זה מעביר חיידקים לאזור הוושט השתני וגורם לזיהום בדרכי השתן.</p><p><strong>גבר:</strong> מנקים את כל האזור — איבר המין, השק, ואת הקפלים בין הירכיים. אם המטופל לא נימול, מורידים בעדינות את העורלה לניקוי, ומחזירים אותה למקומה כדי למנוע לחץ.</p><p><strong>טכניקה:</strong></p><ul><li>מים <strong>פושרים</strong> בלבד — לא חמים, לא קרים.</li><li>סבון <strong>עדין</strong> ללא בושם, רק במידת הצורך, ולא בכל החלפה.</li><li><strong>נוגעים בעדינות</strong> — לא משפשפים. שפשוף פוצע עור עדין.</li><li>מגבון אחד למקום אחד — לא חוזרים על אותו אזור עם מגבון מלוכלך.</li><li>מנקים <strong>גם את כל הקפלים</strong>: בין הירכיים, מתחת לעכוז, בקפל הגבי.</li></ul><p><strong>ייבוש:</strong> זה <strong>הכי חשוב</strong>. מים שנשארים על העור גורמים לתפרחת ולפצעי לחץ. מייבשים בטפיחות עדינות עם מגבת רכה. מוודאים שכל קפל יבש לחלוטין.</p><p><strong>אסור</strong> להשתמש בטלק כשגרה. טלק נכנס לדרכי הנשימה, חוסם נקבוביות ולא מתאים לעור עדין של קשיש.</p>", "en": "<p>Cleaning is the heart of the procedure. Clean and dry skin = healthy skin.</p><p><strong>Female:</strong> always wipe <strong>front to back</strong> — from the front toward the anus. Never go back and then forward with the same wipe — this transfers bacteria to the urinary opening and causes urinary tract infections.</p><p><strong>Male:</strong> clean the entire area — the genital, scrotum, and the folds between the thighs. If the patient is uncircumcised, gently retract the foreskin to clean, then return it to its position to prevent constriction.</p><p><strong>Technique:</strong></p><ul><li><strong>Lukewarm</strong> water only — not hot, not cold.</li><li>A <strong>mild</strong> soap with no perfume, only when needed, and not every change.</li><li><strong>Touch gently</strong> — never scrub. Scrubbing damages delicate skin.</li><li>One wipe per area — never return to the same place with a soiled wipe.</li><li>Clean <strong>all skin folds</strong>: between the thighs, under the buttocks, in the lower back fold.</li></ul><p><strong>Drying</strong> is <strong>the most important step</strong>. Water left on the skin causes rashes and pressure sores. Dry by gently patting with a soft towel. Make sure every fold is completely dry.</p><p><strong>Do not</strong> use talc as routine. Talc enters the airways, blocks pores, and is not suitable for an elderly person's delicate skin.</p>", "ru": "<p>Очищение — сердце всей процедуры. Чистая и сухая кожа = здоровая кожа.</p><p><strong>Женщина:</strong> всегда вытирайте <strong>спереди назад</strong> — от лобковой области к анусу. Никогда не возвращайтесь обратно той же салфеткой — это переносит бактерии к мочевому отверстию и вызывает инфекции мочевых путей.</p><p><strong>Мужчина:</strong> очищайте всю область — половой орган, мошонку и складки между бёдрами. Если человек не обрезан, осторожно отодвиньте крайнюю плоть, очистите, и верните на место, чтобы избежать сдавливания.</p><p><strong>Техника:</strong></p><ul><li>Только <strong>тёплая</strong> вода — не горячая и не холодная.</li><li><strong>Мягкое</strong> мыло без отдушек, только при необходимости и не при каждой смене.</li><li><strong>Прикасайтесь мягко</strong> — никогда не трите. Трение повреждает нежную кожу.</li><li>Одна салфетка на одно место — никогда не возвращайтесь к тому же месту грязной салфеткой.</li><li>Очищайте <strong>все складки</strong>: между бёдер, под ягодицами, в поясничной складке.</li></ul><p><strong>Высушивание</strong> — это <strong>самый важный шаг</strong>. Влага на коже вызывает сыпь и пролежни. Сушите лёгкими промакиваниями мягким полотенцем. Убедитесь, что каждая складка полностью сухая.</p><p><strong>Не используйте</strong> тальк как обычное средство. Тальк попадает в дыхательные пути, забивает поры и не подходит для нежной кожи пожилого человека.</p>", "ml": "<p>വൃത്തിയാക്കൽ പ്രക്രിയയുടെ ഹൃദയമാണ്. ശുദ്ധവും ഉണങ്ങിയതുമായ ചർമ്മം = ആരോഗ്യമുള്ള ചർമ്മം.</p><p><strong>സ്ത്രീ:</strong> എപ്പോഴും <strong>മുമ്പിൽ നിന്ന് പിന്നിലേക്ക്</strong> തുടയ്ക്കുക — മുൻഭാഗത്തുനിന്ന് മലദ്വാരത്തിലേക്ക്. ഒരേ വൈപ്പ് ഉപയോഗിച്ച് പിന്നിലേക്കും പിന്നെ മുന്നോട്ടും പോകരുത് — ഇത് ബാക്ടീരിയയെ മൂത്രദ്വാരത്തിലേക്ക് മാറ്റുകയും മൂത്രനാള അണുബാധയ്ക്ക് കാരണമാകുകയും ചെയ്യും.</p><p><strong>പുരുഷൻ:</strong> എല്ലാ ഭാഗവും വൃത്തിയാക്കുക — ലിംഗം, വൃഷണം, തുടകൾക്കിടയിലുള്ള മടക്കുകൾ. രോഗി പരിച്ഛേദനം ചെയ്തിട്ടില്ലെങ്കിൽ, ലിംഗാഗ്രചർമ്മം സൗമ്യമായി പിന്നോട്ട് നീക്കി വൃത്തിയാക്കി, പിന്നീട് അതിന്റെ സ്ഥാനത്തേക്ക് തിരികെ കൊണ്ടുവരിക.</p><p><strong>ടെക്നിക്:</strong></p><ul><li><strong>ഇളംചൂടുള്ള</strong> വെള്ളം മാത്രം — ചൂടല്ല, തണുപ്പല്ല.</li><li><strong>മൃദുവായ</strong> സുഗന്ധമില്ലാത്ത സോപ്പ്, ആവശ്യമുള്ളപ്പോൾ മാത്രം, ഓരോ മാറ്റത്തിലും അല്ല.</li><li><strong>സൗമ്യമായി സ്പർശിക്കുക</strong> — ഉരയ്ക്കരുത്. ഉരയ്ക്കൽ മൃദുചർമ്മത്തെ പരിക്കേൽപ്പിക്കും.</li><li>ഒരു ഭാഗത്തിന് ഒരു വൈപ്പ് — അഴുക്കായ വൈപ്പുമായി ഒരേ സ്ഥലത്തേക്ക് മടങ്ങരുത്.</li><li><strong>എല്ലാ ചർമ്മ മടക്കുകളും</strong> വൃത്തിയാക്കുക: തുടകൾക്കിടയിൽ, ചന്തിയുടെ താഴെ, പുറംപുറം മടക്കിൽ.</li></ul><p><strong>ഉണക്കൽ</strong> ആണ് <strong>ഏറ്റവും പ്രധാനപ്പെട്ട ഘട്ടം</strong>. ചർമ്മത്തിൽ ബാക്കിയാകുന്ന വെള്ളം തിണർപ്പും ബെഡ് സോറുകളും ഉണ്ടാക്കും. മൃദുവായ ടവൽ കൊണ്ട് സൗമ്യമായി തട്ടി ഉണക്കുക. ഓരോ മടക്കും പൂർണ്ണമായി ഉണങ്ങിയിട്ടുണ്ടെന്ന് ഉറപ്പാക്കുക.</p><p><strong>ടാൽക്ക് പതിവായി ഉപയോഗിക്കരുത്.</strong> ടാൽക്ക് ശ്വാസകോശത്തിലേക്ക് കടക്കുന്നു, പോറുകൾ അടയ്ക്കുന്നു, വൃദ്ധരുടെ മൃദുചർമ്മത്തിന് അനുയോജ്യമല്ല.</p>", "tl": "<p>Ang paglilinis ang puso ng buong gawain. Malinis at tuyong balat = malusog na balat.</p><p><strong>Babae:</strong> palaging punasan <strong>mula harap papunta sa likod</strong> — mula sa harapan papunta sa puwit. Huwag bumalik gamit ang parehong wipe — inililipat nito ang bakterya sa butas ng ihi at nagiging sanhi ng impeksyon sa ihi.</p><p><strong>Lalaki:</strong> linisin ang lahat ng bahagi — ari, bayag, at ang mga tupi sa pagitan ng mga hita. Kung hindi tuli ang pasyente, dahan-dahang ibalik ang balat para linisin, pagkatapos ibalik sa lugar nito para hindi sumikip.</p><p><strong>Paraan:</strong></p><ul><li><strong>Maligamgam</strong> na tubig lang — hindi mainit, hindi malamig.</li><li><strong>Banayad</strong> na sabon na walang pabango, kapag kailangan lang, hindi sa bawat pagpapalit.</li><li><strong>Hawakan nang malumanay</strong> — huwag kuskusin. Sumisira ang pagkuskos sa mahinang balat.</li><li>Isang wipe sa isang lugar — huwag bumalik sa parehong lugar gamit ang maruming wipe.</li><li>Linisin <strong>ang lahat ng tupi sa balat</strong>: pagitan ng mga hita, ilalim ng puwit, sa baba ng likod.</li></ul><p><strong>Ang pagtuyo</strong> ay <strong>ang pinakamahalagang hakbang</strong>. Ang tubig na natitira sa balat ay nagdudulot ng pantal at bedsores. Tuyuin sa pamamagitan ng dahan-dahang pag-tap ng malambot na tuwalya. Siguraduhing tuyong-tuyo ang bawat tupi.</p><p><strong>Huwag</strong> gumamit ng talcum powder bilang routine. Pumapasok ang talcum sa baga, hinaharangan ang pores, at hindi naaangkop sa banayad na balat ng matanda.</p>"}}, {"id": "barrier", "icon": "🧴", "cls": "teal", "img": "barrier", "titles": {"he": "קרם מחסום (Barrier Cream)", "en": "Barrier cream", "ru": "Барьерный крем", "ml": "ബാരിയർ ക്രീം", "tl": "Barrier cream"}, "body": {"he": "<p>קרם מחסום הוא קרם הגנה דק שמונע מגע ישיר בין השתן/הצואה לעור. הוא לא מאוד עבה, לא מבושם, וצריך להיות מאושר לשימוש קשישים (לרוב על בסיס אבץ).</p><ul><li><strong>שכבה דקה בלבד</strong> — לא מורחים בעודף. שכבה עבה אינה ספיגה, חוסמת חמצן בעור ויכולה להחמיר אדמומיות.</li><li>מורחים <strong>רק על עור יבש לחלוטין</strong>. אסור על עור רטוב.</li><li>לא בכל החלפה — בעיקר באזורים של אדמומיות, חשיפה ממושכת לרטיבות, או כשיש סיכון מוגבר לתפרחת.</li><li>אסור להשתמש בקרם מחסום על עור פצוע או על פצע פתוח <strong>ללא הוראת אחות</strong>.</li><li>אם הקרם משאיר כתמים על החיתול — שטוף כפפות בין מריחה לסגירת החיתול.</li></ul>", "en": "<p>Barrier cream is a thin protective cream that prevents direct contact between urine/stool and skin. It is not very thick, not perfumed, and should be approved for elderly use (most are zinc-based).</p><ul><li><strong>A thin layer only</strong> — never apply in excess. A thick layer is not absorbed, blocks oxygen to the skin, and can worsen redness.</li><li>Apply only to <strong>completely dry skin</strong>. Never on wet skin.</li><li>Not at every change — mainly on red areas, after long exposure to wetness, or when there is increased rash risk.</li><li>Do not use barrier cream on a wound or open sore <strong>without a nurse's instruction</strong>.</li><li>If the cream stains the diaper — change gloves between applying cream and closing the diaper.</li></ul>", "ru": "<p>Барьерный крем — тонкий защитный крем, предотвращающий прямой контакт мочи и стула с кожей. Он не густой, без отдушек, и должен быть разрешён для пожилых (чаще всего на основе цинка).</p><ul><li><strong>Только тонкий слой</strong> — никогда не наносите с избытком. Толстый слой не впитывается, блокирует доступ кислорода к коже и может усилить покраснение.</li><li>Наносите только на <strong>полностью сухую кожу</strong>. Никогда — на влажную.</li><li>Не при каждой смене — в основном на покраснения, после долгой влажности или при повышенном риске сыпи.</li><li>Не используйте барьерный крем на ране или открытом повреждении <strong>без указания медсестры</strong>.</li><li>Если крем оставляет следы на подгузнике — поменяйте перчатки между нанесением крема и застёгиванием подгузника.</li></ul>", "ml": "<p>ബാരിയർ ക്രീം മൂത്രവും മലവും ചർമ്മവുമായി നേരിട്ടുള്ള സമ്പർക്കം തടയുന്ന ഒരു നേർത്ത സംരക്ഷണ ക്രീമാണ്. ഇത് വളരെ കട്ടിയുള്ളതോ സുഗന്ധമുള്ളതോ അല്ല, വൃദ്ധർക്ക് ഉപയോഗിക്കാൻ അംഗീകരിച്ചതായിരിക്കണം (മിക്കതും സിങ്ക് അടിസ്ഥാനമാക്കിയുള്ളവയാണ്).</p><ul><li><strong>നേർത്ത പാളി മാത്രം</strong> — അമിതമായി പുരട്ടരുത്. കട്ടിയുള്ള പാളി ആഗിരണം ചെയ്യില്ല, ചർമ്മത്തിലേക്കുള്ള ഓക്സിജൻ തടയും, ചുവപ്പ് വഷളാക്കാം.</li><li><strong>പൂർണ്ണമായും ഉണങ്ങിയ ചർമ്മത്തിൽ</strong> മാത്രം പ്രയോഗിക്കുക. നനഞ്ഞ ചർമ്മത്തിൽ ഒരിക്കലും അല്ല.</li><li>ഓരോ മാറ്റത്തിലും അല്ല — പ്രധാനമായും ചുവന്ന പ്രദേശങ്ങൾ, ദീർഘനേരം നനവിലിരുന്ന ശേഷം, അല്ലെങ്കിൽ തിണർപ്പിന്റെ അപകടസാധ്യത വർദ്ധിച്ചപ്പോൾ.</li><li><strong>നഴ്സിന്റെ നിർദ്ദേശം ഇല്ലാതെ</strong> മുറിവിലോ തുറന്ന വ്രണത്തിലോ ബാരിയർ ക്രീം ഉപയോഗിക്കരുത്.</li><li>ക്രീം ഡയപ്പറിൽ പാടാക്കിയാൽ — ക്രീം പുരട്ടിയതിനും ഡയപ്പർ അടയ്ക്കുന്നതിനും ഇടയിൽ കയ്യുറകൾ മാറ്റുക.</li></ul>", "tl": "<p>Ang barrier cream ay manipis na proteksyon na pumipigil sa direktang pagkadikit ng ihi/dumi sa balat. Hindi ito masyadong makapal, walang pabango, at dapat aprubado para sa matatanda (karamihan ay zinc-based).</p><ul><li><strong>Manipis na layer lang</strong> — huwag lagyan ng sobra. Hindi sumisipsip ang makapal na layer, hinaharangan ang oxygen sa balat, at maaaring lumala ang pamumula.</li><li>Ilagay sa <strong>tuyong-tuyo na balat</strong> lang. Huwag sa basa.</li><li>Hindi sa bawat pagpapalit — pangunahin sa namumulang lugar, pagkatapos ng matagal na pagkababasa, o kung mas mataas ang panganib ng pantal.</li><li>Huwag gumamit ng barrier cream sa sugat o bukas na pinsala <strong>kung walang utos ng nurse</strong>.</li><li>Kung may mantsang naiiwan ang krema sa diaper — palitan ang guwantes sa pagitan ng paglalagay ng krema at pagsasara ng diaper.</li></ul>"}}, {"id": "skincheck", "icon": "🔍", "cls": "amber", "img": "skincheck", "titles": {"he": "בדיקת מצב עור — חובה בכל החלפה", "en": "Skin check — mandatory at every change", "ru": "Проверка кожи — обязательна при каждой смене", "ml": "ചർമ്മ പരിശോധന — ഓരോ മാറ്റത്തിലും നിർബന്ധം", "tl": "Pagsusuri ng balat — kailangan sa bawat pagpapalit"}, "body": {"he": "<p>כל החלפת חיתול היא הזדמנות לבדוק את עור המטופל. אתה הראשון שיכול לזהות בעיה בעור, לפני שהיא הופכת לפצע חמור.</p><p><strong>בכל החלפה — תסתכל ותחפש:</strong></p><ul><li><strong>אדמומיות</strong> — במיוחד באזורי לחץ (עכוז, ישבן, גב תחתון, איזור הזנב).</li><li><strong>עור לבן/שעוונתי או רטוב/מקומט</strong> — סימן ראשון של נזק רטיבות.</li><li><strong>פצעי לחץ ראשונים</strong> — נקודה אדומה שלא נעלמת אחרי 15 דקות בלי לחץ עליה.</li><li><strong>שלפוחיות</strong> או נוזל מתחת לעור.</li><li><strong>פצע פתוח</strong>, חתך, סדק, או דימום.</li><li><strong>ריח חריג</strong>, ריח חמוץ או ריח מתוק חזק (יכול להעיד על זיהום).</li><li><strong>גירוי</strong>, פריחה, או נקודות אדומות קטנות (יכול להיות פטרת).</li><li><strong>שינוי בצבע</strong> — אזור כחלחל/סגול/שחור הוא דחוף.</li></ul><p><strong>חייבים לדווח מיד לאחות או למשפחה אם:</strong></p><ul><li>יש פצע פתוח חדש או מדמם.</li><li>אדמומיות לא נעלמת תוך כמה שעות.</li><li>יש שלפוחיות, נפיחות או נוזל.</li><li>אזור כואב למגע.</li><li>יש ריח חריג מתמשך.</li><li>השתן ריחני מאוד, סמיך, דמי או מועט פתאום.</li></ul>", "en": "<p>Every diaper change is an opportunity to inspect the patient's skin. You are the first person who can spot a problem before it becomes a serious sore.</p><p><strong>At every change — look and look for:</strong></p><ul><li><strong>Redness</strong> — especially on pressure points (buttocks, sacrum, lower back, tailbone).</li><li><strong>White/waxy or wet/wrinkled skin</strong> — early sign of moisture damage.</li><li><strong>Early pressure sores</strong> — a red spot that does not fade within 15 minutes after pressure is removed.</li><li><strong>Blisters</strong> or fluid under the skin.</li><li><strong>Open wound</strong>, cut, crack, or bleeding.</li><li><strong>Unusual smell</strong>, sour or strongly sweet (can indicate infection).</li><li><strong>Irritation</strong>, rash, or small red spots (can be a fungal infection).</li><li><strong>Color change</strong> — a bluish/purple/black area is urgent.</li></ul><p><strong>You must report immediately to the nurse or family if:</strong></p><ul><li>There is a new or bleeding open wound.</li><li>Redness that does not fade within hours.</li><li>Blisters, swelling, or fluid.</li><li>An area is painful to the touch.</li><li>A persistent unusual smell.</li><li>The urine is very smelly, thick, bloody, or suddenly very little.</li></ul>", "ru": "<p>Каждая смена подгузника — возможность осмотреть кожу. Вы первый, кто может заметить проблему, прежде чем она превратится в серьёзную рану.</p><p><strong>При каждой смене — смотрите и ищите:</strong></p><ul><li><strong>Покраснение</strong> — особенно в зонах давления (ягодицы, крестец, поясница, копчик).</li><li><strong>Белая/восковая или мокрая/сморщенная кожа</strong> — ранний признак повреждения от влаги.</li><li><strong>Начальные пролежни</strong> — красное пятно, которое не исчезает в течение 15 минут после снятия давления.</li><li><strong>Пузыри</strong> или жидкость под кожей.</li><li><strong>Открытая рана</strong>, порез, трещина, кровотечение.</li><li><strong>Необычный запах</strong>, кислый или резко сладкий (может указывать на инфекцию).</li><li><strong>Раздражение</strong>, сыпь, мелкие красные точки (возможен грибок).</li><li><strong>Изменение цвета</strong> — синий/фиолетовый/чёрный участок — это срочно.</li></ul><p><strong>Немедленно сообщайте медсестре или семье, если:</strong></p><ul><li>Появилась новая или кровоточащая рана.</li><li>Покраснение не проходит за несколько часов.</li><li>Есть пузыри, отёк или жидкость.</li><li>Зона болезненна при касании.</li><li>Стойкий необычный запах.</li><li>Моча очень пахнет, густая, с кровью или внезапно скудная.</li></ul>", "ml": "<p>ഓരോ ഡയപ്പർ മാറ്റവും രോഗിയുടെ ചർമ്മം പരിശോധിക്കാനുള്ള അവസരമാണ്. ഗുരുതരമായ വ്രണമായി മാറുന്നതിന് മുമ്പ് പ്രശ്നം കണ്ടെത്താൻ കഴിയുന്ന ആദ്യത്തെ വ്യക്തി നിങ്ങളാണ്.</p><p><strong>ഓരോ മാറ്റത്തിലും — നോക്കുക, ഇവ തിരയുക:</strong></p><ul><li><strong>ചുവപ്പ്</strong> — പ്രത്യേകിച്ച് സമ്മർദ്ദ ബിന്ദുക്കളിൽ (ചന്തി, അരക്കെട്ട്, പുറം, വാലെല്ല്).</li><li><strong>വെളുത്ത/മെഴുകുപോലെയോ നനഞ്ഞ/ചുരുങ്ങിയ ചർമ്മം</strong> — ഈർപ്പത്തിന്റെ പ്രാരംഭ നാശ ലക്ഷണം.</li><li><strong>പ്രാരംഭ ബെഡ് സോറുകൾ</strong> — സമ്മർദ്ദം നീക്കിയ ശേഷം 15 മിനിറ്റിനുള്ളിൽ മങ്ങാത്ത ചുവന്ന പാട്.</li><li><strong>കുമിളകൾ</strong> അല്ലെങ്കിൽ ചർമ്മത്തിന് കീഴിൽ ദ്രാവകം.</li><li><strong>തുറന്ന മുറിവ്</strong>, പിളർപ്പ്, വിള്ളൽ, അല്ലെങ്കിൽ രക്തസ്രാവം.</li><li><strong>അസാധാരണ ദുർഗന്ധം</strong>, പുളിച്ച അല്ലെങ്കിൽ ശക്തമായ മധുര ഗന്ധം (അണുബാധയെ സൂചിപ്പിക്കാം).</li><li><strong>ഇറിറ്റേഷൻ</strong>, തിണർപ്പ്, ചെറിയ ചുവന്ന പാടുകൾ (ഫംഗൽ അണുബാധ ആകാം).</li><li><strong>നിറം മാറ്റം</strong> — നീലിച്ച/പർപ്പിൾ/കറുത്ത പ്രദേശം അടിയന്തിരമാണ്.</li></ul><p><strong>ഈ സന്ദർഭങ്ങളിൽ ഉടനടി നഴ്സിനെയോ കുടുംബത്തെയോ അറിയിക്കണം:</strong></p><ul><li>പുതിയ അല്ലെങ്കിൽ രക്തം വരുന്ന തുറന്ന മുറിവ്.</li><li>കുറച്ച് മണിക്കൂറുകൾക്കുള്ളിൽ മങ്ങാത്ത ചുവപ്പ്.</li><li>കുമിളകൾ, വീക്കം, അല്ലെങ്കിൽ ദ്രാവകം.</li><li>സ്പർശിക്കുമ്പോൾ വേദനയുള്ള പ്രദേശം.</li><li>തുടർച്ചയായ അസാധാരണ ദുർഗന്ധം.</li><li>വളരെ ദുർഗന്ധമുള്ള, കട്ടിയുള്ള, രക്തം കലർന്ന, അല്ലെങ്കിൽ പെട്ടെന്ന് വളരെ കുറഞ്ഞ മൂത്രം.</li></ul>", "tl": "<p>Ang bawat pagpapalit ng diaper ay pagkakataon para suriin ang balat ng pasyente. Ikaw ang unang taong makakapansin ng problema bago ito maging malalang sugat.</p><p><strong>Sa bawat pagpapalit — tumingin at hanapin:</strong></p><ul><li><strong>Pamumula</strong> — lalo na sa pressure points (puwit, sacrum, baba ng likod, buto ng buntot).</li><li><strong>Maputi/parang waks o basa/kulubot na balat</strong> — unang senyales ng pinsala ng basa.</li><li><strong>Unang yugto ng bedsores</strong> — pulang puntos na hindi nawawala sa loob ng 15 minuto pagkatapos alisin ang pressure.</li><li><strong>Mga paltos</strong> o tubig sa ilalim ng balat.</li><li><strong>Bukas na sugat</strong>, hiwa, basag, o dumudugo.</li><li><strong>Hindi pangkaraniwang amoy</strong>, maasim o malakas na matamis na amoy (maaaring impeksyon).</li><li><strong>Pangangati</strong>, pantal, o maliliit na pulang puntos (maaaring fungal).</li><li><strong>Pagbabago ng kulay</strong> — bahagi na bughaw/lila/itim ay urgent.</li></ul><p><strong>Kailangang iulat agad sa nurse o pamilya kung:</strong></p><ul><li>May bagong sugat o dumudugong sugat.</li><li>Pamumulang hindi nawawala sa loob ng ilang oras.</li><li>May mga paltos, pamamaga, o tubig.</li><li>May lugar na masakit kapag nahawakan.</li><li>Tuluy-tuloy na hindi pangkaraniwang amoy.</li><li>Ang ihi ay mabaho, makapal, may dugo, o biglang konti.</li></ul>"}}, {"id": "dont", "icon": "🚫", "cls": "rose", "img": null, "titles": {"he": "מה אסור לעשות — לעולם", "en": "What never to do", "ru": "Чего никогда не делать", "ml": "ഒരിക്കലും ചെയ്യരുതാത്തത്", "tl": "Mga huwag na huwag gagawin"}, "body": {"he": "<p>יש פעולות שעלולות לגרום לפציעה גופנית או נפשית של המטופל — גם אם הן נראות \"מהירות\" יותר.</p><ul><li><strong>לא מושכים</strong> את המטופל בזרוע או ברגל. תומכים בכתף ובאגן בלבד.</li><li><strong>לא פועלים במהירות</strong> או בתנועות חדות. כל תנועה חייבת להיות איטית ומבוקרת.</li><li><strong>לא משאירים מטופל חשוף</strong> זמן רב. מכסים מיד את חלקי הגוף שאינם נדרשים.</li><li><strong>לא משתמשים בכוח</strong> אם המטופל מתנגד. אם הוא מתעצבן — עוצרים, ממתינים, מנסים שוב.</li><li><strong>לא מתעלמים מעור פגוע</strong>. כל פצע, אדמומיות שאינה נעלמת או שלפוחית — מדווחים.</li><li><strong>לא משתמשים בסבון רגיל או חזק</strong> או מוצרים מבושמים על אזור החיתול.</li><li><strong>לא משתמשים באלכוהול או יוד</strong> לניקוי האזור — שורף עור פגוע.</li><li><strong>לא מורחים שכבה עבה</strong> של קרם — שכבה עבה גורמת נזק.</li><li><strong>לא משאירים את המטופל בחיתול רטוב או מלוכלך</strong> \"עוד קצת\".</li><li><strong>לא משתמשים בחיתול שלא בגודל הנכון</strong> — קטן מדי דולף, גדול מדי לוחץ.</li><li><strong>לא מדברים על המטופל</strong> כאילו הוא לא שם, גם אם הוא לא מגיב.</li><li><strong>לא צוחקים, לא מבטלים</strong>, לא ממהרים אותו.</li></ul>", "en": "<p>Some actions can cause physical or emotional injury to the patient — even if they seem \"quicker\".</p><ul><li><strong>Do not pull</strong> the patient by the arm or leg. Support the shoulder and the hip only.</li><li><strong>Do not work fast</strong> or with sharp movements. Every motion must be slow and controlled.</li><li><strong>Do not leave the patient exposed</strong> for long. Cover body parts that are not currently being cleaned.</li><li><strong>Do not use force</strong> if the patient resists. If they get upset — stop, wait, try again.</li><li><strong>Do not ignore damaged skin</strong>. Any wound, redness that does not fade, or blister — report it.</li><li><strong>Do not use regular or harsh soap</strong> or perfumed products on the diaper area.</li><li><strong>Do not use alcohol or iodine</strong> to clean the area — they burn damaged skin.</li><li><strong>Do not apply a thick layer</strong> of cream — a thick layer causes harm.</li><li><strong>Do not leave the patient in a wet or soiled diaper</strong> \"just a little longer\".</li><li><strong>Do not use the wrong-size diaper</strong> — too small leaks, too large constricts.</li><li><strong>Do not talk about the patient</strong> as if they are not there, even if they do not respond.</li><li><strong>Do not laugh, do not dismiss</strong>, do not rush them.</li></ul>", "ru": "<p>Некоторые действия могут причинить физический или эмоциональный вред подопечному — даже если кажутся «быстрее».</p><ul><li><strong>Не тяните</strong> человека за руку или ногу. Поддерживайте только плечо и бедро.</li><li><strong>Не работайте быстро</strong> и без резких движений. Каждое движение должно быть медленным и контролируемым.</li><li><strong>Не оставляйте человека открытым</strong> надолго. Прикрывайте те части тела, которые не задействованы.</li><li><strong>Не применяйте силу</strong>, если человек сопротивляется. Если он расстроен — остановитесь, подождите, попробуйте снова.</li><li><strong>Не игнорируйте повреждённую кожу</strong>. Любая рана, не проходящее покраснение или пузырь — сообщайте.</li><li><strong>Не используйте обычное или жёсткое мыло</strong> и парфюмированные средства на области подгузника.</li><li><strong>Не используйте спирт или йод</strong> для очищения — они обжигают повреждённую кожу.</li><li><strong>Не наносите толстый слой</strong> крема — толстый слой вреден.</li><li><strong>Не оставляйте человека в мокром или грязном подгузнике</strong> «ещё чуть-чуть».</li><li><strong>Не используйте подгузник неправильного размера</strong> — маленький протекает, большой давит.</li><li><strong>Не говорите о человеке так, будто его нет</strong>, даже если он не отвечает.</li><li><strong>Не смейтесь, не отмахивайтесь</strong>, не торопите его.</li></ul>", "ml": "<p>ചില പ്രവർത്തനങ്ങൾ രോഗിക്ക് ശാരീരികമോ വൈകാരികമോ ആയ പരിക്ക് ഉണ്ടാക്കാം — അവ \"വേഗത്തിൽ\" തോന്നിയാലും.</p><ul><li>രോഗിയെ കൈകൊണ്ടോ കാലുകൊണ്ടോ <strong>വലിക്കരുത്</strong>. തോളും ഇടുപ്പും മാത്രം താങ്ങുക.</li><li><strong>വേഗത്തിൽ പ്രവർത്തിക്കരുത്</strong> അല്ലെങ്കിൽ പെട്ടെന്നുള്ള ചലനങ്ങളിൽ. ഓരോ ചലനവും സാവധാനവും നിയന്ത്രിതവുമായിരിക്കണം.</li><li>രോഗിയെ <strong>ദീർഘനേരം തുറന്നിടരുത്</strong>. വൃത്തിയാക്കാത്ത ശരീരഭാഗങ്ങൾ മൂടുക.</li><li>രോഗി എതിർത്താൽ <strong>ബലപ്രയോഗം നടത്തരുത്</strong>. അദ്ദേഹം അസ്വസ്ഥനായാൽ — നിർത്തുക, കാത്തിരിക്കുക, വീണ്ടും ശ്രമിക്കുക.</li><li><strong>കേടായ ചർമ്മം അവഗണിക്കരുത്</strong>. ഏതെങ്കിലും മുറിവ്, മങ്ങാത്ത ചുവപ്പ്, അല്ലെങ്കിൽ കുമിള — റിപ്പോർട്ട് ചെയ്യുക.</li><li><strong>സാധാരണ അല്ലെങ്കിൽ കടുത്ത സോപ്പ്</strong> അല്ലെങ്കിൽ സുഗന്ധമുള്ള ഉൽപ്പന്നങ്ങൾ ഡയപ്പർ പ്രദേശത്ത് ഉപയോഗിക്കരുത്.</li><li>പ്രദേശം വൃത്തിയാക്കാൻ <strong>മദ്യമോ അയോഡിനോ ഉപയോഗിക്കരുത്</strong> — അവ കേടായ ചർമ്മത്തെ പൊള്ളിക്കും.</li><li>ക്രീമിന്റെ <strong>കട്ടിയുള്ള പാളി പുരട്ടരുത്</strong> — കട്ടിയുള്ള പാളി ദോഷം ചെയ്യും.</li><li>\"കുറച്ച് കൂടി\" എന്ന് പറഞ്ഞ് <strong>നനഞ്ഞതോ വൃത്തികെട്ടതോ ആയ ഡയപ്പറിൽ രോഗിയെ വിടരുത്</strong>.</li><li><strong>തെറ്റായ വലുപ്പത്തിലുള്ള ഡയപ്പർ ഉപയോഗിക്കരുത്</strong> — ചെറുത് ലീക്ക് ചെയ്യും, വലുത് അമർത്തും.</li><li>രോഗി പ്രതികരിച്ചില്ലെങ്കിലും <strong>അവൻ അവിടെ ഇല്ലാത്തതുപോലെ സംസാരിക്കരുത്</strong>.</li><li><strong>ചിരിക്കരുത്, അവഗണിക്കരുത്</strong>, അവനെ തിരക്കു കൂട്ടരുത്.</li></ul>", "tl": "<p>May mga gawain na maaaring magdulot ng pisikal o emosyonal na pinsala sa pasyente — kahit mukhang \"mas mabilis\" ito.</p><ul><li><strong>Huwag hilain</strong> ang pasyente sa braso o binti. Suportahan lang ang balikat at balakang.</li><li><strong>Huwag magmadali</strong> o gumawa ng biglaang kilos. Ang bawat galaw ay dapat dahan-dahan at kontrolado.</li><li><strong>Huwag iwanang nakabukas</strong> ang pasyente nang matagal. Takpan ang mga bahagi ng katawan na hindi nililinis.</li><li><strong>Huwag gumamit ng pwersa</strong> kung lumalaban ang pasyente. Kung naiinis siya — huminto, maghintay, subukan ulit.</li><li><strong>Huwag balewalain ang nasugatang balat</strong>. Anumang sugat, pamumulang hindi nawawala, o paltos — iulat.</li><li><strong>Huwag gumamit ng ordinaryong o malakas na sabon</strong> o produktong may pabango sa lugar ng diaper.</li><li><strong>Huwag gumamit ng alcohol o iodine</strong> sa paglilinis ng lugar — sumusunog ito sa nasugatang balat.</li><li><strong>Huwag maglagay ng makapal na layer</strong> ng krema — nakakapinsala ang makapal.</li><li><strong>Huwag iwan ang pasyente sa basa o maruming diaper</strong> \"saglit lang muna\".</li><li><strong>Huwag gumamit ng maling sukat ng diaper</strong> — masyadong maliit tumatagas, masyadong malaki sumisikip.</li><li><strong>Huwag pag-usapan ang pasyente</strong> na para bang wala siya, kahit hindi siya sumasagot.</li><li><strong>Huwag tumawa, huwag balewalain</strong>, huwag siyang pagmadaliin.</li></ul>"}}, {"id": "stop", "icon": "⛔", "cls": "rose", "img": null, "titles": {"he": "מתי עוצרים מיד וקוראים לעזרה", "en": "When to stop immediately and get help", "ru": "Когда немедленно остановиться и позвать на помощь", "ml": "എപ്പോൾ ഉടനെ നിർത്തി സഹായം ചോദിക്കണം", "tl": "Kailan dapat huminto agad at humingi ng tulong"}, "body": {"he": "<p>יש מצבים שבהם <strong>חייבים לעצור באמצע הפעולה</strong>, גם אם החיתול הנקי עוד לא הולבש. קודם המטופל — אחר כך השלב הבא.</p><p><strong>עוצרים מיד אם:</strong></p><ul><li>המטופל מביע <strong>כאב חזק</strong> או צועק.</li><li>יש <strong>התנגדות חריגה</strong> שלא היתה קודם — יכולה להעיד על כאב סמוי.</li><li><strong>סחרחורת</strong>, חיוורון, או נשימה לא רגילה.</li><li><strong>חוסר יציבות</strong> פתאומי — נראה שהוא הולך לאבד הכרה.</li><li><strong>פציעה או דימום</strong> שלא היה קודם.</li><li><strong>שלפוחית, פצע פתוח גדול, או עור שחור/סגול</strong> שלא ראית קודם.</li><li>המטופל <strong>לא מגיב</strong> כצפוי, או יש שינוי במצב הכרתו.</li></ul><p><strong>מה לעשות:</strong></p><ol><li>החזר אותו לתנוחה בטוחה (גב), כסה אותו.</li><li>קרא למשפחה / לאחות מטעם המעסיק.</li><li>במצב חירום (חוסר הכרה, נשימה לא תקינה, דימום חזק) — חייג <strong>101</strong> (מד\"א).</li><li>אל תשאיר את המטופל לבד.</li></ol>", "en": "<p>There are situations where you <strong>must stop in the middle of the procedure</strong>, even if the clean diaper is not yet on. The patient comes first — the next step can wait.</p><p><strong>Stop immediately if:</strong></p><ul><li>The patient expresses <strong>strong pain</strong> or cries out.</li><li>There is <strong>unusual resistance</strong> that was not there before — can indicate hidden pain.</li><li><strong>Dizziness</strong>, paleness, or unusual breathing.</li><li>Sudden <strong>instability</strong> — looks as if they may lose consciousness.</li><li><strong>Injury or bleeding</strong> that was not there before.</li><li><strong>A blister, large open wound, or black/purple skin</strong> you have not seen before.</li><li>The patient <strong>is not responding</strong> as expected, or their consciousness has changed.</li></ul><p><strong>What to do:</strong></p><ol><li>Return them to a safe position (on their back), cover them.</li><li>Call the family or the supervising nurse.</li><li>In an emergency (loss of consciousness, abnormal breathing, heavy bleeding) — dial <strong>101</strong> (MDA, Israeli emergency).</li><li>Do not leave the patient alone.</li></ol>", "ru": "<p>Есть ситуации, когда нужно <strong>остановиться посреди процедуры</strong>, даже если чистый подгузник ещё не надет. Сначала — пациент, потом — следующий шаг.</p><p><strong>Немедленно остановитесь, если:</strong></p><ul><li>Подопечный выражает <strong>сильную боль</strong> или кричит.</li><li>Есть <strong>необычное сопротивление</strong>, которого раньше не было — это может говорить о скрытой боли.</li><li><strong>Головокружение</strong>, бледность или необычное дыхание.</li><li>Внезапная <strong>нестабильность</strong> — кажется, что человек может потерять сознание.</li><li><strong>Травма или кровотечение</strong>, которых раньше не было.</li><li><strong>Пузырь, крупная открытая рана или чёрная/фиолетовая кожа</strong>, которых вы раньше не видели.</li><li>Подопечный <strong>не отвечает</strong> как обычно, или его сознание изменилось.</li></ul><p><strong>Что делать:</strong></p><ol><li>Верните в безопасное положение (на спине), накройте.</li><li>Позвоните семье или медсестре от работодателя.</li><li>В экстренной ситуации (потеря сознания, ненормальное дыхание, сильное кровотечение) — наберите <strong>101</strong> (МДА, экстренная служба Израиля).</li><li>Не оставляйте подопечного одного.</li></ol>", "ml": "<p>ശുദ്ധമായ ഡയപ്പർ ഇതുവരെ ധരിച്ചിട്ടില്ലെങ്കിലും <strong>പ്രക്രിയയ്ക്കിടയിൽ നിർത്തേണ്ട</strong> സന്ദർഭങ്ങളുണ്ട്. ആദ്യം രോഗി — അടുത്ത ഘട്ടം പിന്നീട്.</p><p><strong>ഉടനെ നിർത്തുക:</strong></p><ul><li>രോഗി <strong>ശക്തമായ വേദന</strong> പ്രകടിപ്പിക്കുകയോ കരയുകയോ ചെയ്താൽ.</li><li>മുമ്പില്ലാത്ത <strong>അസാധാരണ എതിർപ്പ്</strong> — മറഞ്ഞിരിക്കുന്ന വേദനയെ സൂചിപ്പിക്കാം.</li><li><strong>തല ചുറ്റൽ</strong>, വിളർച്ച, അല്ലെങ്കിൽ അസാധാരണ ശ്വാസം.</li><li>പെട്ടെന്നുള്ള <strong>അസ്ഥിരത</strong> — ബോധം നഷ്ടപ്പെടുന്നതുപോലെ തോന്നുന്നു.</li><li>മുമ്പില്ലാത്ത <strong>പരിക്ക് അല്ലെങ്കിൽ രക്തസ്രാവം</strong>.</li><li>മുമ്പ് കണ്ടിട്ടില്ലാത്ത <strong>കുമിള, വലിയ തുറന്ന മുറിവ്, അല്ലെങ്കിൽ കറുത്ത/പർപ്പിൾ ചർമ്മം</strong>.</li><li>രോഗി <strong>പ്രതീക്ഷിച്ചതുപോലെ പ്രതികരിക്കുന്നില്ല</strong>, അല്ലെങ്കിൽ ബോധാവസ്ഥ മാറി.</li></ul><p><strong>എന്ത് ചെയ്യണം:</strong></p><ol><li>സുരക്ഷിതമായ സ്ഥാനത്തേക്ക് (മലർന്ന്) തിരികെ കൊണ്ടുവന്ന് മൂടുക.</li><li>കുടുംബത്തെയോ തൊഴിലുടമയുടെ നഴ്സിനെയോ വിളിക്കുക.</li><li>അടിയന്തിര സാഹചര്യത്തിൽ (ബോധക്ഷയം, അസാധാരണ ശ്വാസം, കനത്ത രക്തസ്രാവം) — <strong>101</strong> (MDA, ഇസ്രായേലിലെ അടിയന്തിര സേവനം) ഡയൽ ചെയ്യുക.</li><li>രോഗിയെ ഒറ്റയ്ക്ക് വിടരുത്.</li></ol>", "tl": "<p>May mga sitwasyon na <strong>kailangang huminto sa gitna ng paggawa</strong>, kahit hindi pa nasusuot ang malinis na diaper. Ang pasyente muna — ang susunod na hakbang ay pwedeng maghintay.</p><p><strong>Huminto agad kung:</strong></p><ul><li>Nagpapahayag ang pasyente ng <strong>matinding sakit</strong> o sumisigaw.</li><li>May <strong>kakaibang paglaban</strong> na hindi dati — maaaring senyales ng nakatagong sakit.</li><li><strong>Pagkahilo</strong>, pamumutla, o kakaibang paghinga.</li><li>Biglaang <strong>kawalan ng balanse</strong> — parang mawawalan ng malay.</li><li><strong>Sugat o pagdurugo</strong> na hindi dati naroon.</li><li><strong>Paltos, malaking bukas na sugat, o itim/lilang balat</strong> na hindi pa nakikita dati.</li><li>Ang pasyente ay <strong>hindi tumutugon</strong> tulad ng inaasahan, o nagbago ang kanyang malay.</li></ul><p><strong>Ano ang gagawin:</strong></p><ol><li>Ibalik sa ligtas na posisyon (nakahiga), takpan.</li><li>Tawagan ang pamilya o ang nurse ng employer.</li><li>Sa emergency (walang malay, hindi normal na paghinga, malalang pagdurugo) — tumawag sa <strong>101</strong> (MDA, Israeli emergency).</li><li>Huwag iiwan ang pasyente nang mag-isa.</li></ol>"}}, {"id": "finish", "icon": "✅", "cls": "teal", "img": "finish", "titles": {"he": "סיום הפעולה", "en": "Finishing the procedure", "ru": "Завершение процедуры", "ml": "പ്രക്രിയ അവസാനിപ്പിക്കൽ", "tl": "Pagtatapos ng paggawa"}, "body": {"he": "<p>הסיום חשוב כמו ההתחלה. אם דילגת על שלב — החיתול ידלוף, או שהמטופל יישאר לא נוח.</p><ol><li><strong>בודקים שהחיתול יושב נכון</strong> — שני הצדדים סגורים סימטרית, אין קיפולים, אצבע אחת נכנסת בין החיתול לבטן.</li><li><strong>מוודאים שהעור יבש</strong> ושאין רטיבות תחת החיתול.</li><li><strong>מסדרים תנוחה נוחה</strong> — לא משאירים את המטופל על אזור עם פצע או אדמומיות. אם הוא שוכב במשך זמן רב — להחליף תנוחה כל שעתיים.</li><li><strong>שואלים את המטופל אם הוא נוח</strong> — \"האם נוח לך עכשיו?\" — גם אם אינו מדבר. שמים לב לתגובת הפנים.</li><li><strong>מסדרים את הבגדים והמיטה</strong> — סדין מתוח, שמיכה ישרה.</li><li><strong>אוספים את הציוד</strong> — חיתול משומש לשקית סגורה ולפח, מגבונים משומשים לפח, מים שופכים בשירותים.</li><li><strong>מסירים כפפות</strong> בצורה נכונה (מבפנים החוצה, כך שהצד המלוכלך נשאר בפנים).</li><li><strong>שטיפת ידיים</strong> במים וסבון לפחות 20 שניות.</li><li><strong>תיעוד:</strong> אם יש משהו חריג (אדמומיות, פצע, ריח, צבע שתן/צואה לא רגיל) — רושמים ביומן או מודיעים מיד.</li><li><strong>חיוך והודעה למטופל</strong> שהפעולה הסתיימה ושהוא בסדר. כל החלפה היא הזדמנות לבסס יחסי אמון.</li></ol><p><em>מטפל טוב הוא לא רק מי שיודע <strong>איך</strong> להחליף חיתול — אלא מי שמבין <strong>למה</strong> כל שלב חשוב.</em></p>", "en": "<p>The closing is as important as the start. If you skip a step — the diaper will leak, or the patient will be uncomfortable.</p><ol><li><strong>Verify the diaper sits correctly</strong> — both sides fastened symmetrically, no folds, one finger fits between the diaper and the belly.</li><li><strong>Confirm the skin is dry</strong> with no moisture under the diaper.</li><li><strong>Position the patient comfortably</strong> — never on top of a wound or red area. If they lie for a long time — change position every two hours.</li><li><strong>Ask the patient if they are comfortable</strong> — \"Are you comfortable now?\" — even if they do not speak. Watch their facial response.</li><li><strong>Tidy the clothes and the bed</strong> — the sheet stretched, the blanket straight.</li><li><strong>Collect the equipment</strong> — soiled diaper into a sealed bag and into the bin, used wipes into the bin, water poured down the toilet.</li><li><strong>Remove the gloves correctly</strong> (inside out, so the soiled side stays inside).</li><li><strong>Wash your hands</strong> with soap and water for at least 20 seconds.</li><li><strong>Documentation:</strong> if anything was unusual (redness, wound, smell, unusual urine/stool color) — record it in the diary or report immediately.</li><li><strong>A smile and a word</strong> to the patient that the task is done and they are okay. Every change is an opportunity to build trust.</li></ol><p><em>A good caregiver is not only one who knows <strong>how</strong> to change a diaper — but one who understands <strong>why</strong> every step matters.</em></p>", "ru": "<p>Завершение так же важно, как и начало. Пропустив шаг — подгузник протечёт или подопечному будет неудобно.</p><ol><li><strong>Проверьте, что подгузник сидит правильно</strong> — обе стороны застёгнуты симметрично, без складок, один палец входит между подгузником и животом.</li><li><strong>Убедитесь, что кожа сухая</strong> и под подгузником нет влаги.</li><li><strong>Положите подопечного удобно</strong> — никогда не на рану или покраснение. Если он лежит долго — меняйте положение каждые два часа.</li><li><strong>Спросите, удобно ли</strong> — «Тебе сейчас удобно?» — даже если не говорит. Следите за выражением лица.</li><li><strong>Поправьте одежду и постель</strong> — простыню натянуть, одеяло выровнять.</li><li><strong>Соберите оборудование</strong> — грязный подгузник в закрытый пакет и в мусор, использованные салфетки в мусор, воду слить в туалет.</li><li><strong>Снимите перчатки правильно</strong> (выворачивая, чтобы грязная сторона осталась внутри).</li><li><strong>Вымойте руки</strong> с мылом не менее 20 секунд.</li><li><strong>Запись:</strong> если что-то необычное (покраснение, рана, запах, необычный цвет мочи/стула) — записать в дневнике или сразу сообщить.</li><li><strong>Улыбка и слово</strong> подопечному, что всё закончилось и всё хорошо. Каждая смена — возможность укрепить доверие.</li></ol><p><em>Хороший ухаживающий — это не тот, кто знает <strong>как</strong> сменить подгузник, а тот, кто понимает, <strong>почему</strong> каждый шаг важен.</em></p>", "ml": "<p>തുടക്കം പോലെ തന്നെ പ്രധാനമാണ് അവസാനവും. ഒരു ഘട്ടം ഒഴിവാക്കിയാൽ — ഡയപ്പർ ലീക്ക് ചെയ്യും, അല്ലെങ്കിൽ രോഗി അസ്വസ്ഥനാകും.</p><ol><li><strong>ഡയപ്പർ ശരിയായി ഇരിക്കുന്നുവെന്ന് പരിശോധിക്കുക</strong> — ഇരുവശവും സമമിതമായി അടച്ച്, മടക്കുകളില്ല, ഒരു വിരൽ ഡയപ്പറിനും വയറിനും ഇടയിൽ കടക്കും.</li><li><strong>ചർമ്മം ഉണങ്ങിയിരിക്കുന്നുവെന്ന് സ്ഥിരീകരിക്കുക</strong>, ഡയപ്പറിന് കീഴിൽ ഈർപ്പമില്ല.</li><li><strong>രോഗിയെ സൗകര്യപ്രദമായി കിടത്തുക</strong> — ഒരിക്കലും മുറിവിലോ ചുവന്ന പ്രദേശത്തിലോ. ദീർഘനേരം കിടക്കുന്നുവെങ്കിൽ — ഓരോ രണ്ട് മണിക്കൂറിലും സ്ഥാനം മാറ്റുക.</li><li><strong>രോഗിയോട് സൗകര്യപ്രദമാണോ എന്ന് ചോദിക്കുക</strong> — \"ഇപ്പോൾ സൗകര്യപ്രദമാണോ?\" — അദ്ദേഹം സംസാരിക്കുന്നില്ലെങ്കിലും. മുഖപ്രതികരണം ശ്രദ്ധിക്കുക.</li><li><strong>വസ്ത്രവും കിടക്കയും ക്രമീകരിക്കുക</strong> — ഷീറ്റ് നീട്ടി, പുതപ്പ് നേരെയാക്കി.</li><li><strong>സാധനങ്ങൾ ശേഖരിക്കുക</strong> — ഉപയോഗിച്ച ഡയപ്പർ അടച്ച ബാഗിലേക്കും ചവറ്റുകുട്ടയിലേക്കും, ഉപയോഗിച്ച വൈപ്സുകൾ ചവറ്റുകുട്ടയിലേക്ക്, വെള്ളം ടോയ്‌ലറ്റിൽ ഒഴിച്ച് കളയുക.</li><li><strong>കയ്യുറകൾ ശരിയായി ഊരുക</strong> (ഉള്ളിൽ നിന്ന് പുറത്തേക്ക്, അഴുക്കായ വശം ഉള്ളിൽ നിലനിൽക്കുന്നു).</li><li><strong>കൈ കഴുകുക</strong> സോപ്പും വെള്ളവും ഉപയോഗിച്ച് കുറഞ്ഞത് 20 സെക്കൻഡ്.</li><li><strong>ഡോക്യുമെന്റേഷൻ:</strong> എന്തെങ്കിലും അസാധാരണമെങ്കിൽ (ചുവപ്പ്, മുറിവ്, ഗന്ധം, അസാധാരണ മൂത്ര/മല നിറം) — ഡയറിയിൽ രേഖപ്പെടുത്തുക അല്ലെങ്കിൽ ഉടനെ റിപ്പോർട്ട് ചെയ്യുക.</li><li><strong>രോഗിയോട് പുഞ്ചിരി</strong> ജോലി പൂർത്തിയായെന്നും അദ്ദേഹം സുഖമായിരിക്കുന്നുവെന്നും. ഓരോ മാറ്റവും വിശ്വാസം നിർമ്മിക്കാനുള്ള അവസരമാണ്.</li></ol><p><em>നല്ല പരിചരകൻ ഡയപ്പർ <strong>എങ്ങനെ</strong> മാറ്റണമെന്ന് അറിയുന്നയാൾ മാത്രമല്ല — ഓരോ ഘട്ടവും <strong>എന്തുകൊണ്ട്</strong> പ്രധാനമാണെന്ന് മനസ്സിലാക്കുന്നയാൾ കൂടിയാണ്.</em></p>", "tl": "<p>Ang pagtatapos ay kasing-importante ng pagsisimula. Kung nilaktawan mo ang isang hakbang — tatagas ang diaper, o hindi komportable ang pasyente.</p><ol><li><strong>Tingnan kung tama ang pagkakalagay ng diaper</strong> — magkasimetriko ang dalawang gilid, walang nakatupi, kasya ang isang daliri sa pagitan ng diaper at tiyan.</li><li><strong>Siguraduhing tuyo ang balat</strong> at walang basa sa ilalim ng diaper.</li><li><strong>Ilagay ang pasyente sa komportableng posisyon</strong> — huwag kailanman sa ibabaw ng sugat o pamumula. Kung matagal nang nakahiga — palitan ang posisyon kada dalawang oras.</li><li><strong>Tanungin ang pasyente kung komportable</strong> — \"Komportable po ba kayo ngayon?\" — kahit hindi nagsasalita. Pagmasdan ang mukha.</li><li><strong>Ayusin ang damit at kama</strong> — hilang-hila ang sapin, tuwid ang kumot.</li><li><strong>Ipunin ang gamit</strong> — maruming diaper sa saradong basurahang plastik at sa basurahan, mga ginamit na wipes sa basurahan, ibuhos ang tubig sa kubeta.</li><li><strong>Tanggalin nang tama ang guwantes</strong> (papasok palabas, para sa loob nananatili ang maruming bahagi).</li><li><strong>Maghugas ng kamay</strong> sa sabon at tubig nang hindi bababa sa 20 segundo.</li><li><strong>Dokumentasyon:</strong> kung may hindi karaniwan (pamumula, sugat, amoy, hindi karaniwang kulay ng ihi/dumi) — itala sa diary o iulat agad.</li><li><strong>Ngiti at salita</strong> sa pasyente na tapos na at maayos siya. Ang bawat pagpapalit ay pagkakataon para mapagkatiwalaan.</li></ol><p><em>Ang mahusay na tagapag-alaga ay hindi lang ang nakakaalam <strong>paano</strong> magpalit ng diaper — kundi ang nakakaintindi <strong>bakit</strong> mahalaga ang bawat hakbang.</em></p>"}}], "ui": {"header_title": {"he": "מדריך החלפת חיתול", "en": "Diaper Change Guide", "ru": "Руководство по смене подгузника", "ml": "ഡയപ്പർ മാറ്റൽ ഗൈഡ്", "tl": "Gabay sa Pagpapalit ng Diaper"}, "header_subtitle": {"he": "מדריך מקצועי למטפלים בקשישים סיעודיים", "en": "Professional guide for caregivers of dependent elderly", "ru": "Профессиональное руководство let lang = 'he';

function $(s, root){return (root||document).querySelector(s)}
function $$(s, root){return Array.from((root||document).querySelectorAll(s))}

function setUI(){
  $$('[data-ui]').forEach(el=>{
    const k = el.getAttribute('data-ui');
    if(k==='brand'){ el.textContent='Hub2Care'; return; }
    if(APP.ui[k] && APP.ui[k][lang]) el.textContent = APP.ui[k][lang];
  });
}

function buildLangBar(){
  const bar = $('#langbar');
  bar.innerHTML='';
  APP.langs.forEach(L=>{
    const b = document.createElement('button');
    b.className = 'lang-btn' + (L.code===lang ? ' active' : '');
    b.textContent = L.label;
    b.addEventListener('click', ()=>setLang(L.code));
    bar.appendChild(b);
  });
}

function setLang(code){
  lang = code;
  const L = APP.langs.find(l=>l.code===code);
  document.body.setAttribute('lang', code);
  document.body.setAttribute('dir', L.dir);
  document.documentElement.setAttribute('lang', code);
  document.documentElement.setAttribute('dir', L.dir);
  buildLangBar();
  setUI();
  renderSections();
}

function renderSections(){
  const root = $('#sections');
  root.innerHTML='';
  APP.sections.forEach((s, idx)=>{
    const wrap = document.createElement('div');
    wrap.className = 'section cls-' + (s.cls || 'teal');
    wrap.dataset.id = s.id;

    const title = (s.titles && s.titles[lang]) || s.titles.en || s.id;
    const body  = (s.body && s.body[lang]) || s.body.en || '';
    const imgSrc = s.img && APP.img[s.img] ? APP.img[s.img] : null;

    const num = String(idx+1).padStart(2,'0');

    wrap.innerHTML = `
      <button class="sec-head" type="button">
        <span class="sec-icon">${s.icon}</span>
        <span style="flex:1">
          <div class="sec-num">${num}</div>
          <div class="sec-title">${title}</div>
        </span>
        <span class="sec-arrow">▾</span>
      </button>
      <div class="sec-body">
        ${imgSrc ? `<img class="sec-img" src="${imgSrc}" alt="${title}" loading="lazy">` : ''}
        ${body}
      </div>
    `;
    wrap.querySelector('.sec-head').addEventListener('click', ()=>{
      wrap.classList.toggle('open');
    });
    root.appendChild(wrap);
  });
}

$('#expandBtn').addEventListener('click', ()=>$$('.section').forEach(s=>s.classList.add('open')));
$('#collapseBtn').addEventListener('click', ()=>$$('.section').forEach(s=>s.classList.remove('open')));
$('#backBtn').addEventListener('click', ()=>{
  $$('.section').forEach(s=>s.classList.remove('open'));
  window.scrollTo({top:0, behavior:'smooth'});
});

setLang('he');
</script>
</body>
</html>
